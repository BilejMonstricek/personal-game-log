<style>
:root{color-scheme:dark;--bg:#090910;--panel:#12121d;--panel2:#191927;--line:#2b2a40;--text:#f5f3ff;--muted:#aaa7bf;--accent:#a78bfa;--accent2:#e879f9;--good:#72dfaa;--bad:#ff8296}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 12% -10%,#30204b 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#1a1929;padding:10px 15px;transition:.18s}button:hover{border-color:#8d78cf;background:#242139}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#120d20;font-weight:800}.shell{max-width:1440px;margin:auto;padding:26px clamp(16px,4vw,54px) 60px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 24px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--accent)}.tagline{color:var(--muted);font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:2.3px;font-size:11px;color:var(--accent);font-weight:850}.page-title{font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-2px;margin:12px 0}.intro{color:var(--muted);max-width:680px;margin:0}.library-head{padding:36px 0 24px;display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}.search{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#11111b;color:var(--text);min-width:min(280px,100%)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:0;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:17px;min-width:0}.card:hover{transform:translateY(-3px);border-color:#7662bb}.banner{height:190px;position:relative;display:flex;align-items:end;padding:0;overflow:hidden;background:#11111b}.game-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.banner:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(7,7,13,.35),transparent 58%)}.banner:after{display:none}.banner-title{display:none}.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,13,.9),transparent 75%)}.banner:after{content:"";position:absolute;width:190px;height:190px;right:-40px;top:-70px;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 25px #ffffff06,0 0 0 50px #ffffff04}.banner-title{position:relative;z-index:1;font-size:clamp(24px,3vw,38px);font-weight:1000;letter-spacing:-1.5px;line-height:.98;text-transform:uppercase;text-shadow:0 4px 22px #000}.banner-title small{display:block;font-size:12px;letter-spacing:4px;color:#d7caff;margin-bottom:9px}.card-body{padding:17px 18px 19px}.card-name{font-size:17px;font-weight:800}.card-summary{color:#c2bfd2;font-size:13px;margin:7px 0 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;color:#ded9f6;background:#242138;border:1px solid #37324e;padding:4px 8px;border-radius:999px}.rating{font-weight:900;color:var(--accent);font-size:14px}.empty{padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.detail-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-top:28px}.side{position:sticky;top:20px;align-self:start}.back{width:100%;text-align:left;margin-bottom:17px}.ps-cover{aspect-ratio:3/4.2;border-radius:13px;overflow:hidden;position:relative;padding:0;background:#11111b;border:1px solid #5a4b67;box-shadow:0 18px 45px #0008}.ps-cover .game-art{object-position:center}.ps-cover:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#05050b45,transparent 45%)}.ps-cover .ps-label,.ps-cover .ps-title,.ps-cover .ps-footer{display:none}.ps-label,.ps-title,.ps-footer{position:relative;z-index:1}.ps-label{font-size:10px;letter-spacing:2px;font-weight:900}.ps-title{font-size:clamp(27px,3vw,39px);font-weight:1000;line-height:.88;letter-spacing:-1.7px;text-transform:uppercase}.ps-title span{display:block;font-size:11px;letter-spacing:4px;margin-bottom:10px;color:#e6c9d5}.ps-footer{font-size:9px;letter-spacing:1px}.side-note{font-size:12px;color:var(--muted);margin-top:13px}.detail-main{min-width:0}.detail-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hero{min-height:280px;display:flex;align-items:end;padding:clamp(24px,5vw,48px);margin:18px 0 18px;border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 75% 22%,#8a4d59 0,transparent 34%),radial-gradient(ellipse at 15% 80%,#41315e 0,transparent 50%),linear-gradient(135deg,#242137,#0d0d16 80%)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#09091028,#0909109c)}.hero-content{position:relative;z-index:1}.hero h1{font-size:clamp(36px,6vw,70px);line-height:.93;letter-spacing:-3px;margin:10px 0 15px}.hero p{max-width:760px;color:#e1dce9;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0 24px}.stat,.section{background:linear-gradient(145deg,#151522,#101019);border:1px solid var(--line);border-radius:15px;padding:19px}.stat label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.section{margin:15px 0}.section h2{font-size:20px;margin:0 0 13px;letter-spacing:-.3px}.section p{white-space:pre-wrap;color:#d9d5e4;margin:0}.points{display:grid;gap:10px}.point{display:flex;gap:11px;align-items:flex-start;color:#e1deeb}.sign{width:25px;height:25px;display:grid;place-items:center;flex:0 0 25px;border-radius:8px;font-weight:900}.good .sign{background:#143a2a;color:var(--good)}.bad .sign{background:#411c2a;color:var(--bad)}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{background:#101019;border:1px solid var(--line);padding:13px;border-radius:11px}.info span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.info strong{display:block;margin-top:4px}.editor{display:grid;gap:13px}.editor label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.editor input,.editor textarea,.editor select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#090910;color:var(--text)}.editor textarea{min-height:130px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{padding-top:34px;text-align:center;color:#77748c;font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:170px minmax(0,1fr);gap:18px}.ps-title{font-size:29px}}
@media(max-width:620px){.shell{padding:14px 13px 40px}.header{align-items:flex-start}.grid{grid-template-columns:1fr}.banner{height:175px}.detail-layout{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}.back{grid-column:1/-1;margin:0}.ps-cover{width:90px;aspect-ratio:3/4.2;padding:7px}.ps-title{font-size:17px;letter-spacing:-.7px}.ps-title span{font-size:7px;letter-spacing:1px}.ps-label,.ps-footer{font-size:6px}.side-note{margin:0}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:12px}.stat strong{font-size:17px}.stat label{font-size:9px}.two,.info-grid{grid-template-columns:1fr}.hero{min-height:230px}.hero h1{letter-spacing:-1.8px}}
</style>

<body><div class="shell">
<header class="header"><div><div class="brand">🎮 PERSONAL <span>GAME LOG</span></div><div class="tagline">Danův osobní herní deník · moje hry, moje dojmy</div></div><div class="eyebrow">MY GAMING JOURNAL</div></header>
<main id="app"></main>
<footer class="footer">PERSONAL GAME LOG · Osobní názory a vlastní hodnocení</footer>
</div>
<script>
const initialGames=[{
id:"wolverine",title:"Marvel’s Wolverine",shortTitle:"Wolverine",platform:"PlayStation 5",imageUrl:"https://blog.playstation.com/uploads/2025/09/05a8d23ca19068015341a5fc2a248615a84ebb1b.png",hours:"cca 22 hodin",rating:"7,5 / 10",status:"Dohráno · Platinová trofej",developer:"Insomniac Games",publisher:"Sony Interactive Entertainment",genre:"Akční adventura",release:"",
summary:"Hru jsem si užil a dostal jsem zážitek, který jsem od ní očekával. Přesto ve mně nakonec zanechala trochu nemastný neslaný dojem a myslím si, že mohla dopadnout ještě lépe.",
review:"Marvel’s Wolverine mi přinesl přesně ten typ akčního zážitku, který jsem od hry čekal, a hraní jsem si celkově užil. Zároveň ale nejde o hru, ze které bych byl úplně nadšený. Po zkušenostech s předchozími hrami od Insomniacu jsem čekal, že některé věci budou dotaženější. Výsledkem je solidní, lehce nadprůměrný zážitek, který má výrazné silné stránky, ale také několik věcí, kvůli kterým mohl být mnohem lepší.\n\nVizuálně hra umí nabídnout opravdu povedené momenty. Některé lokace, zejména ty v Kanadě, vypadají skvěle, ale kvalita prostředí není stejně vysoká úplně všude. Wolverine jako hlavní postava funguje, souboje mají sílu a filmové scény i střety s bossy patří k zapamatovatelným částem hry. Na druhou stranu se boj postupně začne opakovat, průzkum je omezený a hra hráče často vede za ruku.\n\nPlatinovou trofej jsem získal přibližně za 22 hodin. Ve výsledku jsem rád, že jsem si hru zahrál, ale zůstává ve mně pocit, že její potenciál nebyl využitý naplno. Proto dávám 7,5/10.",
likes:["Povedená grafika a vizuální zpracování","Některé lokace, hlavně v Kanadě, vypadají skvěle","Wolverine je zábavná hlavní postava","Svižné a úderné souboje","Povedený dabing, hudba a celkové zvukové zpracování","Filmové cutscény a souboje s bossy","Dobré herecké výkony záporáků"],
dislikes:["Souboje se postupně začnou opakovat","Málo prostoru pro průzkum a objevování","Hra hráče příliš vede za ruku a je hodně lineární","Občasné bugy a glitche, i když mi zásadně nekazily zážitek","Slabší vedlejší postavy","Mise na motorce mě nebavily","QTE často nemají výraznější následky","Kvalita lokací je nevyrovnaná","Příběh je v některých momentech předvídatelný"]

},{
id:"banishers",title:"Banishers: Ghosts of New Eden",shortTitle:"Banishers",brand:"BANISHERS",platform:"PC",imageUrl:"https://cdn.akamai.steamstatic.com/steam/apps/1493640/header.jpg",coverImageUrl:"https://cdn2.steamgriddb.com/grid/f330097103ff622c360e43832544b2b5.png",hours:"34 hodin",rating:"—",status:"Dohráno",developer:"DON’T NOD",publisher:"Focus Entertainment",genre:"Akční RPG",release:"",
summary:"Atmosférické akční RPG se silným příběhem a výbornými vedlejšími úkoly, které ale v druhé polovině brzdí přehnaný backtracking a neohrabaný pohyb i souboje.",
review:"Banishers: Ghosts of New Eden jsem dohrál za 34 hodin. Zpočátku jsem plnil i většinu vedlejších úkolů, ale zhruba od poloviny na mě hra začala působit natahovaně. Největší problém je častý a někdy až přehnaný backtracking, který v kombinaci s kostrbatým pohybem postav a ne úplně šťastně řešeným rychlým cestováním brzdí tempo hry. Často jsem měl pocit, že jsem víc na cestě než v samotné akci.\n\nHra si bere hodně inspirace z God of War (2018) — od struktury světa, přes překonávání překážek až po celkový feeling soubojů. Jenže tady to není tak plynulé. Soubojový systém je místy neohrabaný a nepůsobí tak přirozeně, jak by si podobná hra zasloužila. RPG prvky jsem navíc ze začátku skoro nevnímal, protože jejich dopad je citelný spíš až později.\n\nMusím ale vyzdvihnout vedlejší úkoly — nejsou to žádné výplňové „questy do počtu“. Jsou překvapivě dobře napsané, tematicky zajímavé a často souvisí s hlavní dějovou linkou. A právě tady přichází důležité varování bez spoilerů: Ve hře je mechanika rozhodování, kde obětováváte určité postavy. Kvůli absenci jakéhokoli ukazatele ale nikdy nevíte, kolik jich už máte na kontě, přestože to zásadně ovlivňuje zakončení hry. Pokud to hráč dopředu netuší, může nedopatřením skončit úplně jiným koncem, než si celý čas budoval.\n\nAtmosféra hry je ale výborná, svět je hezky strukturovaný do několika biomů a graficky působí lehce nadprůměrně. Optimalizace mě mile překvapila a když vezmu v úvahu cenu, za kterou jsem hru koupil, dostal jsem mnohem větší a komplexnější zážitek, než jsem čekal. Příběh mě bavil, i když jsem zřejmě nedostal ten nejlepší konec — což je možná důvod si to někdy dát znovu.",
likes:["Silná atmosféra a zajímavý příběh","Velmi dobré vedlejší úkoly napojené na hlavní děj, žádná výplň","Velký herní svět rozdělený do více biomů","Spousta secretů a obsahu pro hráče, kteří rádi prozkoumávají","Důležitá rozhodnutí s reálným dopadem na finále","Solidní optimalizace","Na svou cenu překvapivě komplexní a výpravná hra","Lehce nadprůměrná grafika a hezké prostředí"],
dislikes:["Tempo se v druhé polovině docela natahuje","Až příliš backtrackingu","Pohyb je neintuitivní, plný neviditelných bariér a nalajnovaných cest","Soubojový systém je kostrbatý a méně plynulý než inspirovaný GoW 2018","Rychlé cestování je řešené nešťastně a brzdí tempo","Hra neukazuje počet obětovaných postav, přestože to zásadně ovlivňuje konec","Velké množství úkolů a postav může po čase působit zahlcujícím dojmem","Dabing postav zní tak trošku jednotvárně, ale asi jen osobní pohled"]

}];
const storageKey="personal-game-log-games-v5";
let games=JSON.parse(localStorage.getItem(storageKey)||"null")||initialGames;
let view="library",selected=games[0]?.id||null,editing=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem(storageKey,JSON.stringify(games));render()}
function card(g){return '<button class="card" data-open="'+esc(g.id)+'"><div class="banner">'+(g.imageUrl?'<img class="game-art" src="'+esc(g.imageUrl)+'" alt="'+esc(g.title)+' artwork" loading="lazy">':'<div class="banner-title">'+esc(g.title)+'</div>')+'</div><div class="card-body"><div class="card-name">'+esc(g.title)+'</div><p class="card-summary">'+esc(g.summary||"Osobní recenze zatím není vyplněná.")+'</p><div class="chips"><span class="chip">'+esc(g.platform||"Platforma neuvedena")+'</span><span class="chip">'+esc(g.hours||"Doba neuvedena")+'</span><span class="rating">'+esc(g.rating||"—")+'</span></div></div></button>'}
function library(){return '<section class="library-head"><div><div class="eyebrow">MOJE KNIHOVNA</div><h1 class="page-title">Hry, které jsem hrál.</h1><p class="intro">Osobní dojmy, vlastní hodnocení a podrobné recenze. Žádné univerzální verdikty — jen můj pohled na hry.</p></div><div class="actions"><input id="search" class="search" placeholder="Hledat v knihovně…" aria-label="Hledat hru"><button class="primary" id="addBtn">＋ Přidat hru</button></div></section><div class="grid" id="grid">'+games.map(card).join("")+'</div>'}
function detail(g){return '<div class="detail-layout"><aside class="side"><button class="back" id="backBtn">← Zpět do seznamu her</button><div class="ps-cover">'+(g.coverImageUrl||g.imageUrl?'<img class="game-art" src="'+esc(g.coverImageUrl||g.imageUrl)+'" alt="'+esc(g.title)+' cover art">':'<div class="ps-title">'+esc(g.title)+'</div>')+'</div><div class="side-note">Moje knihovna · osobní recenze</div></aside><article class="detail-main"><div class="detail-top"><div class="eyebrow">MOJE RECENZE</div><div class="actions"><button id="editBtn">Upravit recenzi</button></div></div><section class="hero" '+(g.imageUrl?'style="background-image:linear-gradient(90deg,#090910d9,#09091075),url(&quot;'+esc(g.imageUrl)+'&quot;);background-size:cover;background-position:center"':'')+'><div class="hero-content"><div class="eyebrow">'+esc(g.status||"Osobní recenze")+'</div><h1>'+esc(g.title)+'</h1><p>'+esc(g.summary||"Osobní shrnutí zatím není vyplněné.")+'</p><div class="meta"><span class="chip">'+esc(g.platform||"Platforma neuvedena")+'</span><span class="chip">'+esc(g.hours||"Doba neuvedena")+'</span><span class="chip">'+esc(g.status||"")+'</span></div></div></section><div class="stats"><div class="stat"><label>Moje hodnocení</label><strong>'+esc(g.rating||"—")+'</strong></div><div class="stat"><label>Odehráno</label><strong>'+esc(g.hours||"—")+'</strong></div><div class="stat"><label>Platforma</label><strong>'+esc(g.platform||"—")+'</strong></div></div><section class="section"><h2>Moje recenze a verdikt</h2><p>'+esc(g.review||g.summary||"Recenze zatím není vyplněná.")+'</p></section><section class="section"><h2>＋ Co se mi líbilo</h2><div class="points">'+(g.likes||[]).map(x=>'<div class="point good"><span class="sign">＋</span><span>'+esc(x)+'</span></div>').join("")+'</div></section><section class="section"><h2>− Co mi vadilo</h2><div class="points">'+(g.dislikes||[]).map(x=>'<div class="point bad"><span class="sign">−</span><span>'+esc(x)+'</span></div>').join("")+'</div></section><section class="section"><h2>Informace o hře</h2><div class="info-grid"><div class="info"><span>Vývojář</span><strong>'+esc(g.developer||"Neuvedeno")+'</strong></div><div class="info"><span>Vydavatel</span><strong>'+esc(g.publisher||"Neuvedeno")+'</strong></div><div class="info"><span>Žánr</span><strong>'+esc(g.genre||"Neuvedeno")+'</strong></div></div></section></article></div>'}
function editor(g){return '<div class="detail-layout"><aside class="side"><button class="back" id="cancelBack">← Zpět na recenzi</button><div class="ps-cover">'+(g.imageUrl?'<img class="game-art" src="'+esc(g.imageUrl)+'" alt="'+esc(g.title)+' artwork">':'<div class="ps-title">'+esc(g.title)+'</div>')+'</div></aside><section class="detail-main section"><h2>Upravit hru a recenzi</h2><form id="form" class="editor"><label>Název hry<input name="title" required value="'+esc(g.title)+'"></label><label>URL širokého obrázku (seznam a recenze)<input name="imageUrl" value="'+esc(g.imageUrl||"")+'" placeholder="https://…"></label><label>URL obálky (portrét vlevo)<input name="coverImageUrl" value="'+esc(g.coverImageUrl||"")+'" placeholder="https://…"></label><div class="two"><label>Platforma<input name="platform" value="'+esc(g.platform)+'"></label><label>Herní doba<input name="hours" value="'+esc(g.hours)+'"></label></div><div class="two"><label>Hodnocení<input name="rating" value="'+esc(g.rating)+'"></label><label>Stav<input name="status" value="'+esc(g.status)+'"></label></div><div class="two"><label>Vývojář<input name="developer" value="'+esc(g.developer)+'"></label><label>Vydavatel<input name="publisher" value="'+esc(g.publisher)+'"></label></div><label>Krátké shrnutí<textarea name="summary">'+esc(g.summary)+'</textarea></label><label>Moje kompletní recenze / verdikt<textarea name="review">'+esc(g.review)+'</textarea></label><label>Co se mi líbilo — každý bod na nový řádek<textarea name="likes">'+esc((g.likes||[]).join('\n'))+'</textarea></label><label>Co mi vadilo — každý bod na nový řádek<textarea name="dislikes">'+esc((g.dislikes||[]).join('\n'))+'</textarea></label><div class="actions"><button class="primary" type="submit">Uložit změny</button><button type="button" id="cancelBtn">Zrušit</button></div><p class="tagline">Poznámka: úpravy v tomto formuláři se ukládají jen do tohoto prohlížeče, ne do veřejné stránky.</p></form></section></div>'}
function bind(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{selected=b.dataset.open;view="detail";editing=false;render()});const back=$("backBtn");if(back)back.onclick=()=>{view="library";editing=false;render()};const edit=$("editBtn");if(edit)edit.onclick=()=>{editing=true;render()};const add=$("addBtn");if(add)add.onclick=()=>{const g={id:"game-"+Date.now(),title:"Nová hra",shortTitle:"Nová hra",platform:"",hours:"",rating:"",status:"Rozehráno",developer:"",publisher:"",genre:"",release:"",summary:"",review:"",likes:[],dislikes:[]};games.unshift(g);selected=g.id;view="detail";editing=true;render()};const search=$("search");if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll("[data-open]").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"":"none")};const cancel=$("cancelBtn");if(cancel)cancel.onclick=()=>{editing=false;render()};const cancelBack=$("cancelBack");if(cancelBack)cancelBack.onclick=()=>{editing=false;render()};const form=$("form");if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const g=games.find(x=>x.id===selected);["title","platform","hours","rating","status","developer","publisher","summary","review","imageUrl","coverImageUrl"].forEach(k=>g[k]=String(d.get(k)||"").trim());g.shortTitle=g.title.replace(/^Marvel[’']s\\s*/i,"");g.likes=String(d.get("likes")||"").split('\n').map(s=>s.trim()).filter(Boolean);g.dislikes=String(d.get("dislikes")||"").split('\n').map(s=>s.trim()).filter(Boolean);editing=false;persist()}}
function render(){const app=$("app");if(view==="library"){app.innerHTML=library()}else{const g=games.find(x=>x.id===selected);app.innerHTML=g?(editing?editor(g):detail(g)):'<button id="backBtn">← Zpět do seznamu her</button>'; }bind()}
render();
</script></body></html>
