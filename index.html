*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 12% -10%,#30204b 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#1a1929;padding:10px 15px;transition:.18s}button:hover{border-color:#8d78cf;background:#242139}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#120d20;font-weight:800}.shell{max-width:1440px;margin:auto;padding:26px clamp(16px,4vw,54px) 60px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 24px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--accent)}.tagline{color:var(--muted);font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:2.3px;font-size:11px;color:var(--accent);font-weight:850}.page-title{font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-2px;margin:12px 0}.intro{color:var(--muted);max-width:680px;margin:0}.library-head{padding:36px 0 24px;display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}.search{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#11111b;color:var(--text);min-width:min(280px,100%)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:0;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:17px;min-width:0}.card:hover{transform:translateY(-3px);border-color:#7662bb}.banner{height:190px;position:relative;display:flex;align-items:end;padding:0;overflow:hidden;background:#11111b}.game-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.banner:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(7,7,13,.35),transparent 58%)}.banner:after{display:none}.banner-title{display:none}.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,13,.9),transparent 75%)}.banner:after{content:"";position:absolute;width:190px;height:190px;right:-40px;top:-70px;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 25px #ffffff06,0 0 0 50px #ffffff04}.banner-title{position:relative;z-index:1;font-size:clamp(24px,3vw,38px);font-weight:1000;letter-spacing:-1.5px;line-height:.98;text-transform:uppercase;text-shadow:0 4px 22px #000}.banner-title small{display:block;font-size:12px;letter-spacing:4px;color:#d7caff;margin-bottom:9px}.card-body{padding:17px 18px 19px}.card-name{font-size:17px;font-weight:800}.card-summary{color:#c2bfd2;font-size:13px;margin:7px 0 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;color:#ded9f6;background:#242138;border:1px solid #37324e;padding:4px 8px;border-radius:999px}.rating{font-weight:900;color:var(--accent);font-size:14px}.empty{padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.detail-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-top:28px}.side{position:sticky;top:20px;align-self:start}.back{width:100%;text-align:left;margin-bottom:17px}.ps-cover{aspect-ratio:3/4.2;border-radius:13px;overflow:hidden;position:relative;padding:0;background:#11111b;border:1px solid #5a4b67;box-shadow:0 18px 45px #0008}.ps-cover .game-art{object-position:center}.ps-cover:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#05050b45,transparent 45%)}.ps-cover .ps-label,.ps-cover .ps-title,.ps-cover .ps-footer{display:none}.ps-label,.ps-title,.ps-footer{position:relative;z-index:1}.ps-label{font-size:10px;letter-spacing:2px;font-weight:900}.ps-title{font-size:clamp(27px,3vw,39px);font-weight:1000;line-height:.88 101019;border:1px solid var(--line);padding:13px;border-radius:11px}.info span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.info strong{display:block;margin-top:4px}.editor{display:grid;gap:13px}.editor label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.editor input,.editor textarea,.editor select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#090910;color:var(--text)}.editor textarea{min-height:130px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{padding-top:34px;text-align:center;color:#77748c;font-size:12px}

id:"wolverine",title:"Marvel’s Wolverine",shortTitle:"Wolverine",platform:"PlayStation 5",imageUrl:"https://blog.playstation.com/uploads/2025/09/05a8d23ca19068015341a5fc2a248615a84ebb1b.png",hours:"cca 22 hodin",rating:"7,5 / 10",status:"Dohráno · Platinová trofej",developer:"Insomniac Games",publisher:"Sony Interactive Entertainment",genre:"Akční adventura",release:"",
summary:"Hru jsem si užil a dostal jsem zážitek, který jsem od ní očekával. Přesto ve mně nakonec zanechala trochu nemastný neslaný dojem a myslím si, že mohla dopadnout ještě lépe.",
review:"Marvel’s Wolverine mi přinesl přesně ten typ akčního zážitku, který jsem od hry čekal, a hraní jsem si celkově užil. Zároveň ale nejde o hru, ze které bych byl úplně nadšený. Po zkušenostech s předchozími hrami od Insomniacu jsem čekal, že některé věci budou dotaženější. Výsledkem je solidní, lehce nadprůměrný zážitek, který má výrazné silné stránky, ale také několik věcí, kvůli kterým mohl být mnohem lepší.\n\nVizuálně hra umí nabídnout opravdu povedené momenty. Některé lokace, zejména ty v Kanadě, vypadají skvěle, ale kvalita prostředí není stejně vysoká úplně všude. Wolverine jako hlavní postava funguje, souboje mají sílu a filmové scény i střety s bossy patří k zapamatovatelným částem hry. Na druhou stranu se boj postupně začne opakovat, průzkum je omezený a hra hráče často vede za ruku.\n\nPlatinovou trofej jsem získal přibližně za 22 hodin. Ve výsledku jsem rád, že jsem si hru zahrál, ale zůstává ve mně pocit, že její potenciál nebyl využitý naplno. Proto dávám 7,5/10.",
likes:["Povedená grafika a vizuální zpracování","Některé lokace, hlavně v Kanadě, vypadají skvěle","Wolverine je zábavná hlavní postava","Svižné a úderné souboje","Povedený dabing, hudba a celkové zvukové zpracování","Filmové cutscény a souboje s bossy","Dobré herecké výkony záporáků"],
dislikes:["Souboje se postupně začnou opakovat","Málo prostoru pro průzkum a objevování","Hra hráče příliš vede za ruku a je hodně lineární","Občasné bugy a glitche, i když mi zásadně nekazily zážitek","Slabší vedlejší postavy","Mise na motorce mě nebavily","QTE často nemají výraznější následky","Kvalita lokací je nevyrovnaná","Příběh je v některých momentech předvídatelný"]

},{
id:"banishers",title:"Banishers: Ghosts of New Eden",shortTitle:"Banishers",brand:"BANISHERS",platform:"PC",imageUrl:"https://cdn.akamai.steamstatic.com/steam/apps/1493640/header.jpg",coverImageUrl:"https://cdn2.steamgriddb.com/grid/f330097103ff622c360e43832544b2b5.png",hours:"34 hodin",rating:"—",status:"Dohráno",developer:"DON’T NOD",publisher:"Focus Entertainment",genre:"Akční RPG",release:"",
summary:"Atmosférické akční RPG se silným příběhem a výbornými vedlejšími úkoly, které ale v druhé polovině brzdí přehnaný backtracking a neohrabaný pohyb i souboje.",
review:"Banishers: Ghosts of New Eden jsem dohrál za 34 hodin. Zpočátku jsem plnil i většinu vedlejších úkolů, ale zhruba od poloviny na mě hra začala působit natahovaně. Největší problém je častý a někdy až přehnaný backtracking, který v kombinaci s kostrbatým pohybem postav a ne úplně šťastně řešeným rychlým cestováním brzdí tempo hry. Často jsem měl pocit, že jsem víc na cestě než v samotné akci.\n\nHra si bere hodně inspirace z God of War (2018) — od struktury světa, přes překonávání překážek až po celkový feeling soubojů. Jenže tady to není tak plynulé. Soubojový systém je místy neohrabaný a nepůsobí tak přirozeně, jak by si podobná hra zasloužila. RPG prvky jsem navíc ze začátku skoro nevnímal, protože jejich dopad je citelný spíš až později.\n\nMusím ale vyzdvihnout vedlejší úkoly — nejsou to žádné výplňové „questy do počtu“. Jsou překvapivě dobře napsané, tematicky zajímavé a často souvisí s hlavní dějovou linkou. A právě tady přichází důležité varování bez spoilerů: Ve hře je mechanika rozhodování, kde obětováváte určité postavy. Kvůli absenci jakéhokoli ukazatele ale nikdy nevíte, kolik jich už máte na kontě, přestože to zásadně ovlivňuje zakončení hry. Pokud to hráč dopředu netuší, může nedopatřením skončit úplně jiným koncem, než si celý čas budoval.\n\nAtmosféra hry je ale výborná, svět je hezky strukturovaný do několika biomů a graficky působí lehce nadprůměrně. Optimalizace mě mile překvapila a když vezmu v úvahu cenu, za kterou jsem hru koupil, dostal jsem mnohem větší a komplexnější zážitek, než jsem čekal. Příběh mě bavil, i když jsem zřejmě nedostal ten nejlepší konec — což je možná důvod si to někdy dát znovu.",
likes:["Silná atmosféra a zajímavý příběh","Velmi dobré vedlejší úkoly napojené na hlavní děj, žádná výplň","Velký herní svět rozdělený do více biomů","Spousta secretů a obsahu pro hráče, kteří rádi prozkoumávají","Důležitá rozhodnutí s reálným dopadem na finále","Solidní optimalizace","Na svou cenu překvapivě komplexní a výpravná hra","Lehce nadprůměrná grafika a hezké prostředí"],
dislikes:["Tempo se v druhé polovině docela natahuje","Až příliš backtrackingu","Pohyb je neintuitivní, plný neviditelných bariér a nalajnovaných cest","Soubojový systém je kostrbatý a méně plynulý než inspirovaný GoW 2018","Rychlé cestování je řešené nešťastně a brzdí tempo","Hra neukazuje počet obětovaných postav, přestože to zásadně ovlivňuje konec","Velké množství úkolů a postav může po čase působit zahlcujícím dojmem","Dabing postav zní tak trošku jednotvárně, ale asi jen osobní pohled"]},

{
id:"arkham-asylum",title:"Batman: Arkham Asylum",shortTitle:"Arkham Asylum",platform:"PC",imageUrl:"https://cdn.akamai.steamstatic.com/steam/apps/35140/header.jpg",hours:"7–8 hodin",rating:"8,5 / 10",status:"Dohráno",developer:"Rocksteady Studios",publisher:"Warner Bros. Interactive Entertainment",genre:"Akční adventura",release:"2009",
summary:"I po letech skvělá komiksová akce se zábavným soubojovým systémem, perfektním dabingem a výbornou optimalizací. Slabší jsou hlavně bossfighty a občasné přebíhání mezi částmi ostrova.",
review:"K Batman: Arkham Asylum jsem se vrátil po dvanácti letech, abych si znovu prošel celou arkhamovskou ságu. Dohrání mi zabralo přibližně 7 až 8 hodin. Není to nijak dlouhá hra, ale kratší herní doba mi vůbec nevadila — těch několik hodin zábavy jsem si užil.\n\nNa hru z roku 2009 vypadá Arkham Asylum pořád velmi dobře, což je znát hlavně na obličejích hlavních postav. Hra si držela krásně stabilní FPS a prakticky jsem nenarazil na žádné záseky. Jedinou výjimkou byla situace ve věži u zvonu, kdy výkon spadl téměř na 3 FPS; opakování checkpointu ale problém vyřešilo. Za zmínku stojí také PhysX efekty na páře, kouři nebo poletujících kusech papíru. Optimalizace je výborná a velkou pochvalu si zaslouží dabing Batmana i hlavních záporáků, především Jokera.\n\nPo stránce hratelnosti jde o titul, který nastavil laťku pro další hry, a nejvíc je to znát na soubojovém systému. Je zábavný, plynulý, responzivní a člověk si na něj rychle zvykne. Systém protiútoků se stal inspirací pro řadu dalších her a údery doprovází skvělé zvukové efekty. Batman je ale někdy až trochu přehnaně silný — stačí zaútočit a dokáže přeskočit skoro celou místnost, což působí zvláštně.\n\nVelkým pomocníkem je detektivní mód, díky kterému vidíte skrz překážky a můžete si plánovat další postup. Je jen na vás, jestli zvolíte stealth, nebo přímou konfrontaci; proti nepřátelům se samopaly se ale bezhlavý útok příliš nevyplácí. Batmanův opasek nabízí osm gadgetů a každý má ve hře své využití. Ostrov je rozdělený do několika částí, mezi kterými musíte přebíhat, zatímco úkoly mají poměrně pevně dané cesty. Hra tak působí jako uzavřený, spíše lineární open world. Najdete tu také spoustu hádanek a tajemství od Riddlera, z nichž některá jsou opravdu dobře schovaná.\n\nNěkolik bossfightů sice hra nabídne, ale většinou nejsou příliš náročné a závěrečný souboj na mě působil vyloženě slabě. Příběh je do určité míry očekávatelný, ale funguje jako začátek větší ságy — a právě proto se těším na Arkham City. Arkham Asylum nemám moc co vytknout kromě několika drobností. Přecházení mezi částmi ostrova může časem lézt na nervy a souboje s bossy za zbytkem hry zaostávají. Jinak mi hra nabídla přibližně sedm hodin skvělé zábavy. Hodnocení: 8,5/10.",
likes:["Zábavný, plynulý a responzivní soubojový systém","Perfektní dabing, zejména Batman a Joker","Výborná optimalizace a stabilní FPS","I po letech povedená grafika, hlavně obličeje postav","Působivé PhysX efekty: pára, kouř a poletující papíry","Detektivní mód pro plánování postupu","Užitečné gadgety a možnost kombinovat stealth s přímým bojem","Hádanky a dobře schovaná tajemství od Riddlera","Skvělé ozvučení úderů","Povedený začátek arkhamovské ságy"],
dislikes:["Přebíhání mezi částmi ostrova může časem lézt na nervy","Bossfighty jsou většinou slabší a málo náročné","Závěrečný souboj působí obzvlášť slabě","Batmanovy útoky a přesuny přes velkou část místnosti někdy působí přehnaně silně","Ojedinělý propad výkonu u věže se zvonem, vyřešený opakováním checkpointu"]

{"id":"evil-within","title":"The Evil Within","shortTitle":"The Evil Within","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/268050/header.jpg","hours":"12 hodin","rating":"8 / 10","status":"Dohráno · bez DLC","developer":"Tango Gameworks","publisher":"Bethesda Softworks","genre":"Survival horror","release":"2014","summary":"Po 12 hodinách jsem si The Evil Within pěkně užil. Skvělá atmosféra, nápadité bossfighty a nedostatek munice z něj dělají poctivý horor, i když mu občas škodí kamera, černé pruhy a natahované pasáže.","review":"Konečně jsem se dostal k dohrání The Evil Within (zatím bez DLC) a po 12 hodinách můžu říct, že jsem si hru pěkně užil.\n\nHra je z roku 2014, takže je na ní občas její stáří poznat, ale i tak je po grafické stránce velmi obstojná. Za celou dobu jsem nenarazil ani na jeden bug, glitch nebo jinou chybu. V tomhle je hra perfektní. Bodík dolů jí ale musím dát za hrozný poměr stran. Obrovské černé pruhy nahoře i dole jsem si musel vypnout až po povolení konzole. Stejně tak jsem odemkl FPS nad 30. Audio jako celek působí dobře — zvuky zbraní a monster i hudba jsou přesně takové, jaké od hororovky čekáte. Zdálo se mi ale, že se dabing občas nedokáže přizpůsobit situaci, takže v nějakém silném momentu postava prakticky jen „oddychne“. Hra je optimalizovaná na jedničku.\n\nVážně silnou stránkou hry je gameplay, který podtrhuje skvělá atmosféra! Každá zbraň v inventáři si najde uplatnění, mimo jiné proto, že munice je opravdu málo. Po celou dobu musíte přemýšlet, kolik nábojů si můžete dovolit vystřílet. Hra rozhodně netrpí tím, že se z vás od druhé poloviny stane rambo s haldou munice kolem pasu, jako se to děje v jiných hrách. Palec nahoru. Rozhodně se vyplatí prozkoumat každý kout a rozbít každou krabici. Většina lokací je zpracovaná na výbornou a společně s perfektně vymodelovanými monstry — japonská absurdita je vidět na každém kroku — vytváří hru, ve které jsem se opravdu dokázal bát. Ve hře je také spousta skvělých bossfightů, které jsou nápadité. Ne vždycky jde jen o to bosse rozstřílet!\n\nHra má i systém vylepšování. Jeho přínos je znatelný, i když se v něm najdou zbytečné možnosti. Abych nezapomněl: občas jsem měl problém s kamerou, obzvlášť při střelbě na blízko.\n\nZ příběhu jsem trochu zmatený, ale tohle bude asi jen můj problém. Uvidíme, jestli mi The Evil Within 2 pomůže některé věci vysvětlit.\n\nHru rozhodně můžu doporučit těm, kdo chtějí trochu výzvu. Málo munice není na škodu — právě tenhle aspekt z ní dělá správný horor.","likes":["Skvělá atmosféra, ve které jsem se opravdu dokázal bát","Nápadité a perfektní bossfighty","Velmi slušná grafika i audio stránka hry","Výborně vymodelovaná monstra a typická japonská absurdita","Každá zbraň má své využití díky nedostatku munice","Poctivá výzva a nutnost šetřit náboji","Výborná optimalizace a bezproblémový průběh bez bugů"],"dislikes":["Občas nešikovná kamera, hlavně při střelbě na blízko","Obrovské černé pruhy kvůli původnímu poměru stran; lze vypnout přes konzoli","Některé pasáže mohou působit zbytečně natahovaně","Dabing občas nereaguje na intenzitu situace","Příběh může být místy matoucí"]}

{"id":"prototype-2","title":"Prototype 2","shortTitle":"Prototype 2","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/115320/header.jpg","hours":"14 hodin","rating":"6,5 / 10","status":"Dohráno · všechny sběratelské předměty a vedlejší aktivity","developer":"Radical Entertainment","publisher":"Activision","genre":"Akční adventura","release":"2012",
"summary":"Skvělá zábava, když chcete vypnout hlavu a kosit všechno kolem sebe. Parádní schopnosti a gameplay ale sráží mizerná optimalizace, tragická kamera a repetitivní vedlejší mise.",
"review":"Super zábava, pokud u hry nechcete moc přemýšlet a chcete jen kosit vše okolo!\n\nNa konec dějové linky jsem se dostal za 14 hodin, ale zároveň jsem splnil všechny sběratelské předměty i vedlejší mise a aktivity. Pro pochopení souvislostí ale doporučuju odehrát první díl.\n\nNa to, že hra vyšla v roce 2012, je grafika spíš průměrná, možná lehce podprůměrná. Efekty schopností jsou povedené, dabing hlavních postav se docela povedl a filmečky vypadají dobře. Celkově je ale PC port hrozný a je vidět, že hra byla vyvíjena hlavně pro konzole. Textury mají nízké rozlišení, kamera je naprosto otřesná a největším problémem je optimalizace. Na sestavě s GTX 1070 a i5-9600K hra nedokáže udržet stabilní FPS a v mnoha scénách dochází k výrazným propadům snímkové frekvence. Abych hru vůbec spustil, musel jsem navíc z externích stránek stáhnout další soubory, jinak vyhazovala chybu. Tohle je nepřípustné.\n\nKde ale hra exceluje, je fantastický gameplay! Pět hlavních schopností, které postupně odemykáte, je podobných těm z prvního dílu, ale jsou ještě vylepšené, a přibyla i jedna nová. Vylepšování postavy funguje jinak než v jedničce: vylepšení získáváte například postupem ve vedlejších misích nebo vysáváním cílů, místo abyste si je kupovali. Časem se z vás stane nezastavitelná mašina na zabíjení a máte pocit obrovské síly, což je přesně to, co tahle hra potřebuje.\n\nVe hře je několik bossfightů, které jsou ale bohužel jednodušší než souboje s vylepšenými druhy nepřátel, a to i na HARD. Mapa je rozdělená do tří velkých částí plných aktivit. Později můžete zabrat i tank nebo vrtulník, ale to už není taková zábava. Vedlejší mise mají malou variabilitu a často se opakují — vystopovat a vysát konkrétní cíle nebo někam dojít a všechny zabít. Časem je to repetitivní a plníte je hlavně kvůli upgradům, které za to ale stojí.\n\nJe zvláštní, ale v dobrém slova smyslu, že hlavním záporákem je postava, za kterou jste hráli v prvním díle. To hráče zaujme. Vývoj příběhu je relativně očekávaný, ale najde se i pár překvapivých zvratů. Heller mi jako hlavní postava vůbec nepřišel sympatický a člověk si k němu nemá moc možnost vytvořit pouto, což je škoda.\n\nHru dost zachraňuje samotný koncept: antihrdina se superschopnostmi v plně otevřeném Manhattanu. Masakrovat všechno a všechny, plachtit a skákat po mrakodrapech je neskutečná zábava, kterou ale kazí technický stav hry a opakující se mise. I tak bych hru doporučil, protože se člověk dokáže vyblbnout a hra ho zabaví.",
"likes":["Fantastický gameplay a pocit obrovské síly","Pět hlavních schopností a jejich vylepšování","Skvělý koncept antihrdiny se superschopnostmi v otevřeném Manhattanu","Zábavné masakrování nepřátel, plachtění a skákání po mrakodrapech","Povedené efekty schopností","Solidní dabing hlavních postav a filmečky","Vedlejší aktivity přinášejí užitečné upgrady"],
"dislikes":["Velmi špatná optimalizace a výrazné propady FPS","Tragická kamera, kvůli které lze snadno zemřít","Slabší grafická stránka a nízké rozlišení textur","Repetitivní vedlejší mise","Bossfighty jsou příliš snadné i na HARD","Heller není příliš sympatický","Ke spuštění PC verze bylo nutné shánět dodatečné soubory z externích stránek"]}

{"id":"shadow-of-mordor","title":"Middle-earth: Shadow of Mordor","shortTitle":"Shadow of Mordor","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/241930/header.jpg","hours":"17 hodin","rating":"8,5 / 10","status":"Dohráno · základní hra, DLC čekají","developer":"Monolith Productions","publisher":"Warner Bros. Interactive Entertainment","genre":"Akční adventura","release":"2014",
"summary":"Po návratu do Mordoru jsem si hru užil snad ještě víc než při vydání. Skvělý soubojový systém, technické zpracování, soundtrack a Nemesis systém vyvažují slabé bossfighty a občas kostrbaté lezení.",
"review":"Hru jsem dohrál naposledy v roce 2014, když vyšla, ale zlákalo mě zahrát si ji znovu a připomenout si, co mě na ní tehdy bavilo. A užil jsem si ji snad ještě o něco víc.\n\nNa to, že už má hra nějaké roky za sebou, pořád dokáže vypadat nádherně, zejména ve druhé lokaci, kde je všechno travnaté a zbarvené do zelena. Škoda jen, že povedené cutscény mají nižší rozlišení a trochu tím ztrácejí na kráse. Hra je perfektně optimalizovaná a prošel jsem ji bez jediného záseku, propadu FPS nebo bugu. Animace chůze, běhu i soubojů jsou hezky plynulé a postava nepůsobí jako prkenný panák. Při lezení už to tak dobré není. Dabing, obzvlášť u skřetů, se povedl na jedničku a fantastický soundtrack ještě víc připomíná atmosféru Pána prstenů.\n\nGameplay je mixem Assassin’s Creed a her Batman: Arkham a tahle kombinace funguje skvěle. Dostanete se do dvou velkých lokací, které postupně odkrýváte. Vylézt se dá skoro na každou stěnu, budovu nebo skálu, což nabízí spoustu taktických možností. Soubojový systém je příjemně responzivní a postava bez prodlevy dělá to, co po ní chcete. I když je ve hře poměrně dost schopností, nemůžete si je odemknout všechny hned — některé důležité získáte až postupem příběhu.\n\nHlavní mechanikou je systém Nemesis, tedy hierarchie skřetí armády, do které zasahujete verbováním nebo zabíjením kapitánů. Mně osobně časem začal trochu vadit, protože se stává repetitivním. Zajímavé ale je, že se liší typy velitelů, kterým můžete buď čelit, nebo pomoct někomu jinému převzít jejich místo. Každý velitel má vlastní slabé a silné stránky, které je nejprve potřeba zjistit, třeba vyslechnutím informátorů. Na každého platí něco jiného, a to je super.\n\nPříběh je podle mě klasická pomsta doplněná menšími příběhy vedlejších postav. Není to nic převratného, ale ani neurazí — vyprávění je pěkně podané. Co mě naopak zklamalo, jsou bossfighty proti hlavním záporákům. Čekal jsem velkolepé souboje, ale dostal jsem víceméně jen pár quick-time eventů. Obyčejné souboje s veliteli jsou mnohem záživnější, delší a výrazně složitější.\n\nOvládání postavy někdy působí kostrbatě, hlavně při lezení. Pokud přesně nezmáčknete směrovou klávesu nebo joystick, postava vás nemusí poslouchat. Přechod na zábradlí nebo úskok na protější římsu se tak často mění v boj o nervy.\n\nPolovinu hry jsem se snažil sbírat všechny collectibles a plnit výzvy, takže jsem se dostal na zhruba 17 hodin herního času. Jde pouze o základní hru — DLC mě ještě čekají.",
"likes":["Skvělé technické zpracování a výborná optimalizace","Responzivní a zábavný soubojový systém","Parádní soundtrack a atmosféra Pána prstenů","Systém Nemesis jako výborný nápad","Možnost lézt téměř všude a využívat terén takticky","Schopnosti Celebrimbora","Souboje s kapitány a jejich rozdílné slabiny a silné stránky","Plynulé animace a povedený dabing, zejména skřetů"],
"dislikes":["Bossfighty proti hlavním záporákům jsou příliš jednoduché, slabší než běžné souboje s veliteli","Občas kostrbaté ovládání, především při lezení","Systém Nemesis se časem může stát repetitivním","Cutscény mají nižší rozlišení než zbytek hry"]}

{"id":"rise-of-the-tomb-raider","title":"Rise of the Tomb Raider","shortTitle":"Rise of the Tomb Raider","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/391220/header.jpg","hours":"17 hodin","rating":"8,5 / 10","status":"Dohráno","developer":"Crystal Dynamics","publisher":"Square Enix","genre":"Akční adventura","release":"2015",
"summary":"Oproti prvnímu rebootu jde o výrazný posun: nádherná grafika, skvělé animace, nové mechaniky a rozsáhlý průzkum. Dobrodružství ale postupně ztrácí survival nádech a až příliš okatě vede hráče za ruku.",
"review":"Po prvním rebootu Lary, který jsem dohrál těsně před tímhle dílem, jsem čekal, že Rise of the Tomb Raider bude i přes doslechnuté informace lepší. A moje očekávání se naplnila — ba co víc, hra je ještě předčila!\n\nGrafický posun oproti prvnímu dílu je neskutečný. Ať už jde o zasněžené, písčité, nebo podzemní lokace, všechno vypadá fantasticky i po letech. Velkou roli v tom hraje nasvícení: světlo tu funguje parádně a obyčejná glowstick dokáže z tmavé jeskyně udělat krásnou podívanou. Animace obličejů, především Lary, jsou špičkové — věříte jí každou emoci a lip-sync působí jako z filmu. Dabing postav byl už v prvním díle na vysoké úrovni a tady tomu není jinak. Hra je skvěle optimalizovaná a i na mé GTX 1070 běžela na velmi vysoké detaily s pár vypnutými zbytečnostmi.\n\nHra se posunula k jakémusi „open worldu“. Dostanete tři nebo čtyři velké lokace k prozkoumávání a k tomu hromadu menších, které je propojují. Velké oblasti navíc ukrývají další menší i větší lokace v podobě hrobek, krypt a jeskyní. Gameplay mě bavil výrazně víc než v prvním díle: přibylo vybavení, zbraně, nové mechaniky a hlavně vedlejší mise. Vylepšování postavy pomocí skillpointů zůstalo a podle mě má větší dopad na hratelnost. Hádanky nejsou nijak extrémně těžké, ale u několika z nich — a je jich dost — jsem se zapotil. Pokud rádi sbíráte předměty a prozkoumáváte, můžete tu strávit hodiny hledáním kešek, relikvií a dalších věcí. Umělá inteligence je průměrná: někdy nepřátelé stojí jako blbci, jindy vás pronásledují, i když vás už nemohou vidět.\n\nI když se hra tváří jako open world, docela vás vede za nos. Přístupové cesty a římsy jsou označené bílou nebo červenou barvou, takže prostředí působí uměle a člověk ani nemá potřebu cestu hledat. Celkově je hra až moc připravená na váš postup. Výbušné sudy, petrolejové lampy i samotný směr cesty jsou nastražené příliš okatě. Hra už také nemá tak silný survival nádech jako první díl: munice i surovin na výrobu šípů, lékárniček nebo speciální munice je dostatek. Často se tak cítíte jako terminátor, který všechno vykosí, což je škoda.\n\nKonec celkem zajímavého příběhu jsem si prostřílel a proskákal za zhruba 17 hodin. Od poslední čtvrtiny hry jsem už trochu kašlal na prozkoumávání každého kouta kvůli dokumentům a dalším drobnostem. Za 9 euro v nejlepší edici hru rozhodně doporučuju, nejlépe ale společně s původním dílem.",
"likes":["Skvělé technické zpracování a nádherná grafika","Působivé nasvícení prostředí a povedené animace obličejů","Velmi dobrý dabing a lip-sync","Výborná optimalizace i na starším hardwaru","Nové mechaniky, zbraně a vybavení","Vylepšování postavy má znatelný vliv na hratelnost","Rozsáhlé lokace, hrobky, krypty, jeskyně a sběratelské předměty","Vedlejší mise a zajímavé hádanky","Celkově poutavý příběh"],
"dislikes":["Od druhé poloviny je hra výrazně jednodušší","Cesty, římsy a interaktivní prvky jsou až příliš okatě označené","Prostředí často působí připraveně tak, aby hráče co nejjednodušeji vedlo","Slabší survival pocit kvůli velkému množství munice a surovin","Umělá inteligence je jen průměrná"]}

{"id":"alan-wake","title":"Alan Wake","shortTitle":"Alan Wake","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/108710/header.jpg","hours":"10 hodin","rating":"7 / 10","status":"Dohráno","developer":"Remedy Entertainment","publisher":"Microsoft Game Studios","genre":"Akční adventura / psychologický thriller","release":"2010",
"summary":"Silná hororová atmosféra Bright Falls, příběh, který je potřeba prožít, a skvěle využitá baterka dělají z Alana Wakea zábavné dobrodružství i přes stáří a kolísající obtížnost.",
"review":"Alan Wake byl ve své době takovou malou revolucí, i když jsem úplně nechápal proč. Hra mi nabídla zhruba 10 hodin a můžu říct, že jsem si je všechny užil.\n\nGameplay je dost lineární, což se ale u takové hry dá čekat. Hra vás vede za ruku až moc okatě — všechny cíle jsou na minimapě vyznačené žlutou tečkou, takže se nestane, že byste si něco museli poctivě najít.\n\nHlavní pilíř hry, světlo, funguje perfektně! Konečně hra, ve které je baterka opravdu k užitku a vlastně vás drží při životě. Nepřátele musíte nejdřív oslabit světlem a teprve potom na ně platí zbraně. Je to parádní prvek, díky kterému musíte dávat pozor. Souboje jsou tím pádem náročnější, což je jedině dobře. Všechny zbraně jsou užitečné a budete je střídat jak na běžícím páse. Hra ale v první polovině trochu trpí balancem obtížnosti: i obyčejný nepřítel vydrží čtyři rány a munice ze začátku moc není. Dostal jsem se i do situace, kdy jsem neměl vůbec nic a musel jsem k cíli jen utíkat a pomáhat si baterkou. Zhruba od třetiny hry jsem si naopak připadal jako nezastavitelná mašina, protože na každém rohu ležely světlice nebo náboje. Najde se i pár pasáží za volantem, většinou ale jde jen o kratší doplnění hratelnosti.\n\nHra už má svoje roky a je to vidět, ale to neznamená, že patří do šrotu. Animace obličejů, především při mluvení, jsou překvapivě dobré a působí důvěryhodně. To samé platí pro předělové filmečky — když člověk přehlédne slabší grafiku, působí skoro jako z filmu. Prostředí amerického horského venkova je zpracované na výbornou. V kombinaci s temnou hororovou atmosférou Bright Falls není co vytknout. Atmosféru navíc podtrhuje skvělé, místy opravdu hodně strašidelné ozvučení nepřátel i samotného prostředí.\n\nPříběh je něco, co si budete muset prožít na vlastní kůži. Pokud se do něj zakousnete, nebudete zklamaní!\n\nZa zhruba 10 hodin jsem si užil silnou atmosféru, příběh i zábavné souboje. Optimalizace je vzhledem ke stáří hry také povedená.",

"dislikes":["Obtížnost je nevyvážená a s postupem hry výrazně klesá","Lineární postup a cíle příliš okatě vyznačené na minimapě","Některé pasáže jsou zbytečně natahované","Občas zlobí ovládání postavy"]}

{"id":"dishonored","title":"Dishonored","shortTitle":"Dishonored","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/205100/header.jpg","hours":"12 hodin","rating":"9 / 10","status":"Dohráno · základní hra bez DLC","developer":"Arkane Studios","publisher":"Bethesda Softworks","genre":"Akční adventura / stealth","release":"2012",
"summary":"Výborně navržená stealth akce, která nechává hráče volit vlastní styl, nabízí nelineární lokace, užitečné schopnosti a několik konců ovlivněných vašimi činy.",
"review":"Základní hru Dishonored bez DLC jsem dokončil za nějakých 12 hodin, což jsem před rozehráním vůbec nečekal, takže mě to mile překvapilo.\n\nHra má zajímavě stylizovanou grafiku, takovou lehce cartoonovou až kreslenou. To ale neznamená, že tu nepoteče krev nebo nebudou lítat hlavy. Hra se tím krásně odlišuje a působí originálně.\n\nHlavním stavebním kamenem je určitě gameplay, a ten je špičkový. Hra vás vyloženě nenutí do jednoho herního stylu, takže můžete lokace projít jako tichý assassin, nebo jako mašina na zabíjení. Tomu nahrává i samotné procházení úrovní — není tak lineární, jak by se mohlo zdát. Na místo určení se dá dostat několika cestami, takže se vyplatí využívat vertikalitu prostředí. Hlavní i spoustu vedlejších úkolů lze splnit různými způsoby a některé z nich odemykají i achievementy. Vedlejší mise jsou různorodé a často vyžadují prolézt každý kout lokace. Korunu tomu nasazují speciální schopnosti, které budete využívat prakticky pořád a jsou opravdu užitečné — i když ne všechny. Vylepšování schopností pomocí run, které hledáte ve světě, má znatelný dopad na průběh hry. Pokud máte dost fantazie, existuje nespočet způsobů, jak jejich pomocí likvidovat nepřátele. Ti jsou navíc až překvapivě chytří a mnohdy vám dokážou pořádně zatopit.\n\nPříběh má několik konců a o tom, který uvidíte, rozhoduje váš přístup k nepřátelům. To je neskutečná věc. Čím více mrtvol za sebou necháte, tím temnější bude svět kolem vás, takže postupujte s rozvahou. Nechci o příběhu moc mluvit — každý si ho musí projít na vlastní kůži.\n\nNějaké zápory bych našel, ale jde spíš o osobní preference. Grafika je sice zajímavá, ale mně tenhle styl moc nesedí. Některé schopnosti jsem za celou dobu skoro nepoužíval, maximálně na vyzkoušení, takže jsem za ně zbytečně utrácel runy. Souboje na blízko jsou trochu kostrbaté. Krytí sice funguje, ale dosah meče je občas nepochopitelný — někdy to ani nevypadá, že na vás nepřítel může dosáhnout. Bossfightů je navíc pomálu a i ty jsou hrozně lehké.\n\nI přes tyhle výhrady je Dishonored parádní hra, která dává hráči svobodu a odměňuje experimentování. Za mě 9/10.",

const storageKey="personal-game-log-games-v6";
let games=JSON.parse(localStorage.getItem(storageKey)||"null")||initialGames;for(const defaultId of ["arkham-asylum","prototype-2","shadow-of-mordor","rise-of-the-tomb-raider","alan-wake","dishonored","call-of-duty-wwii"]){const defaultGame=initialGames.find(g=>g.id===defaultId);if(defaultGame&&!games.some(g=>g.id===defaultId)){games.push(defaultGame);localStorage.setItem(storageKey,JSON.stringify(games));}}
let view="library",selected=games[0]?.id||null,editing=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function persist(){localStorage.setItem(storageKey,JSON.stringify(games));render()}
function card(g){return '<button class="card" data-open="'+esc(g.id)+'"><div class="banner">'+(g.imageUrl?'<img class="game-art" src="'+esc(g.imageUrl)+'" alt="'+esc(g.title)+' artwork" loading="lazy">':'<div class="banner-title">'+esc(g.title)+'</div>')+'</div><div class="card-body"><div class="card-name">'+esc(g.title)+'</div><p class="card-summary">'+esc(g.summary||"Osobní recenze zatím není vyplněná.")+'</p><div class="chips"><span class="chip">'+esc(g.platform||"Platforma neuvedena")+'</span><span class="chip">'+esc(g.hours||"Doba neuvedena")+'</span><span class="rating">'+esc(g.rating||"—")+'</span></div></div></button>'}
function library(){return '<section class="library-head"><div><div class="eyebrow">MOJE KNIHOVNA</div><h1 class="page-title">Hry, které jsem hrál.</h1><p class="intro">Osobní dojmy, vlastní hodnocení a podrobné recenze. Žádné univerzální verdikty — jen můj pohled na hry.</p></div><div class="actions"><input id="search" class="search" placeholder="Hledat v knihovně…" aria-label="Hledat hru"><button class="primary" id="addBtn">＋ Přidat hru</button></div></section><div class="grid" id="grid">'+games.map(card).join("")+'</div>'}
function detail(g){return '<div class="detail-layout"><aside class="side"><button class="back" id="backBtn">← Zpět do seznamu her</button><div class="ps-cover">'+(g.coverImageUrl||g.imageUrl?'<img class="game-art" src="'+esc(g.coverImageUrl||g.imageUrl)+'" alt="'+esc(g.title)+' cover art">':'<div class="ps-title">'+esc(g.title)+'</div>')+'</div><div class="side-note">Moje knihovna · osobní recenze</div></aside><article class="detail-main"><div class="detail-top"><div class="eyebrow">MOJE RECENZE</div><div class="actions"><button id="editBtn">Upravit recenzi</button><button id="deleteBtn">Smazat recenzi</button></div></div><section class="hero" '+(g.imageUrl?'style="background-image:linear-gradient(90deg,#090910d9,#09091075),url(&quot;'+esc(g.imageUrl)+'&quot;);background-size:cover;background-position:center"':'')+'><div class="hero-content"><div class="eyebrow">'+esc(g.status||"Osobní recenze")+'</div><h1>'+esc(g.title)+'</h1><p>'+esc(g.summary||"Osobní shrnutí zatím není vyplněné.")+'</p><div class="meta"><span class="chip">'+esc(g.platform||"Platforma neuvedena")+'</span><span class="chip">'+esc(g.hours||"Doba neuvedena")+'</span><span class="chip">'+esc(g.status||"")+'</span></div></div></section><div class="stats"><div class="stat"><label>Moje hodnocení</label><strong>'+esc(g.rating||"—")+'</strong></div><div class="stat"><label>Odehráno</label><strong>'+esc(g.hours||"—")+'</strong></div><div class="stat"><label>Platforma</label><strong>'+esc(g.platform||"—")+'</strong></div></div><section class="section"><h2>Moje recenze a verdikt</h2><p>'+esc(g.review||g.summary||"Recenze zatím není vyplněná.")+'</p></section><section class="section"><h2>＋ Co se mi líbilo</h2><div class="points">'+(g.likes||[]).map(x=>'<div class="point good"><span class="sign">＋</span><span>'+esc(x)+'</span></div>').join("")+'</div></section><section class="section"><h2>− Co mi vadilo</h2><div class="points">'+(g.dislikes||[]).map(x=>'<div class="point bad"><span class="sign">−</span><span>'+esc(x)+'</span></div>').join("")+'</div></section><section class="section"><h2>Informace o hře</h2><div class="info-grid"><div class="info"><span>Vývojář</span><strong>'+esc(g.developer||"Neuvedeno")+'</strong></div><div class="info"><span>Vydavatel</span><strong>'+esc(g.publisher||"Neuvedeno")+'</strong></div><div class="info"><span>Žánr</span><strong>'+esc(g.genre||"Neuvedeno")+'</strong></div></div></section></article></div>'}
function editor(g){return '<div class="detail-layout"><aside class="side"><button class="back" id="cancelBack">← Zpět na recenzi</button><div class="ps-cover">'+(g.imageUrl?'<img class="game-art" src="'+esc(g.imageUrl)+'" alt="'+esc(g.title)+' artwork">':'<div class="ps-title">'+esc(g.title)+'</div>')+'</div></aside><section class="detail-main section"><h2>Upravit hru a recenzi</h2><form id="form" class="editor"><label>Název hry<input name="title" required value="'+esc(g.title)+'"></label><label>URL širokého obrázku (seznam a recenze)<input name="imageUrl" value="'+esc(g.imageUrl||"")+'" placeholder="https://…"></label><label>URL obálky (portrét vlevo)<input name="coverImageUrl" value="'+esc(g.coverImageUrl||"")+'" placeholder="https://…"></label><div class="two"><label>Platforma<input name="platform" value="'+esc(g.platform)+'"></label><label>Herní doba<input name="hours" value="'+esc(g.hours)+'"></label></div><div class="two"><label>Hodnocení<input name="rating" value="'+esc(g.rating)+'"></label><label>Stav<input name="status" value="'+esc(g.status)+'"></label></div><div class="two"><label>Vývojář<input name="developer" value="'+esc(g.developer)+'"></label><label>Vydavatel<input name="publisher" value="'+esc(g.publisher)+'"></label></div><label>Krátké shrnutí<textarea name="summary">'+esc(g.summary)+'</textarea></label><label>Moje kompletní recenze / verdikt<textarea name="review">'+esc(g.review)+'</textarea></label><label>Co se mi líbilo — každý bod na nový řádek<textarea name="likes">'+esc((g.likes||[]).join('\n'))+'</textarea></label><label>Co mi vadilo — každý bod na nový řádek<textarea name="dislikes">'+esc((g.dislikes||[]).join('\n'))+'</textarea></label><div class="actions"><button class="primary" type="submit">Uložit změny</button><button type="button" id="cancelBtn">Zrušit</button><button type="button" id="deleteBtn">Smazat hru a recenzi</button></div><p class="tagline">Poznámka: úpravy v tomto formuláři se ukládají jen do tohoto prohlížeče, ne do veřejné stránky.</p></form></section></div>'}
function removeSelectedGame(){const g=games.find(x=>x.id===selected);if(!g)return;if(!confirm('Opravdu chceš odstranit hru „'+g.title+'“ i celou její recenzi z této knihovny? Tuto akci nelze vrátit.'))return;games=games.filter(x=>x.id!==selected);selected=games[0]?.id||null;view="library";editing=false;persist()}
function bind(){document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{selected=b.dataset.open;view="detail";editing=false;render()});const back=$("backBtn");if(back)back.onclick=()=>{view="library";editing=false;render()};const edit=$("editBtn");if(edit)edit.onclick=()=>{editing=true;render()};const del=$("deleteBtn");if(del)del.onclick=removeSelectedGame;const add=$("addBtn");if(add)add.onclick=()=>{const g={id:"game-"+Date.now(),title:"Nová hra",shortTitle:"Nová hra",platform:"",hours:"",rating:"",status:"Rozehráno",developer:"",publisher:"",genre:"",release:"",summary:"",review:"",likes:[],dislikes:[]};games.unshift(g);selected=g.id;view="detail";editing=true;render()};const search=$("search");if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll("[data-open]").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"":"none")};const cancel=$("cancelBtn");if(cancel)cancel.onclick=()=>{editing=false;render()};const cancelBack=$("cancelBack");if(cancelBack)cancelBack.onclick=()=>{editing=false;render()};const form=$("form");if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const g=games.find(x=>x.id===selected);["title","platform","hours","rating","status","developer","publisher","summary","review","imageUrl","coverImageUrl"].forEach(k=>g[k]=String(d.get(k)||"").trim());g.shortTitle=g.title.replace(/^Marvel[’']s\\s*/i,"");g.likes=String(d.get("likes")||"").split('\n').map(s=>s.trim()).filter(Boolean);g.dislikes=String(d.get("dislikes")||"").split('\n').map(s=>s.trim()).filter(Boolean);editing=false;persist()}}
function render(){const app=$("app");if(view==="library"){app.innerHTML=library()}else{const g=games.find(x=>x.id===selected);app.innerHTML=g?(editing?editor(g):detail(g)):'<button id="backBtn">← Zpět do seznamu her</button>'; }bind()}
render();
</script></body></html>
