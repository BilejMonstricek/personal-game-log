<style>
:root{color-scheme:dark;--bg:#090910;--panel:#12121d;--panel2:#191927;--line:#2b2a40;--text:#f5f3ff;--muted:#aaa7bf;--accent:#a78bfa;--accent2:#e879f9;--glow:#30204b;--good:#72dfaa;--bad:#ff8296}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 12% -10%,var(--glow) 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:11px;background:#1a1929;padding:10px 15px;transition:.18s}button:hover{border-color:#8d78cf;background:#242139}button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#120d20;font-weight:800}.shell{max-width:1440px;margin:auto;padding:26px clamp(16px,4vw,54px) 60px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 24px;border-bottom:1px solid var(--line)}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--accent)}.tagline{color:var(--muted);font-size:13px}.eyebrow{text-transform:uppercase;letter-spacing:2.3px;font-size:11px;color:var(--accent);font-weight:850}.page-title{font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-2px;margin:12px 0}.intro{color:var(--muted);max-width:680px;margin:0}.library-head{padding:36px 0 24px;display:flex;align-items:end;justify-content:space-between;gap:18px;flex-wrap:wrap}.search{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#11111b;color:var(--text);min-width:min(280px,100%)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{padding:0;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:17px;min-width:0;position:relative;cursor:grab;transform:translateZ(0);transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,opacity .18s ease;box-shadow:0 4px 14px #00000012;touch-action:pan-y}.card:hover{transform:translateY(-5px) scale(1.018);border-color:var(--accent);box-shadow:0 12px 30px #00000045,0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent),0 0 24px color-mix(in srgb,var(--accent) 15%,transparent);z-index:2}.card:active{cursor:grabbing}.card.dragging{opacity:.42;transform:scale(.97);box-shadow:0 0 0 2px var(--accent);cursor:grabbing}.card.drag-over{transform:translateY(-3px) scale(1.035);border-color:var(--accent2);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent2) 55%,transparent),0 14px 35px #00000055}.card.drop-pop{animation:drop-pop .34s cubic-bezier(.2,.8,.2,1)}@keyframes drop-pop{0%{transform:scale(.96)}55%{transform:scale(1.035)}100%{transform:scale(1)}}.sort-hint{font-size:12px;color:var(--muted);margin:0 0 14px}.banner{height:190px;position:relative;display:flex;align-items:end;padding:0;overflow:hidden;background:#11111b}.game-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.banner:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(7,7,13,.35),transparent 58%)}.banner:after{display:none}.banner-title{display:none}.banner:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,7,13,.9),transparent 75%)}.banner:after{content:"";position:absolute;width:190px;height:190px;right:-40px;top:-70px;border:1px solid #ffffff18;border-radius:50%;box-shadow:0 0 0 25px #ffffff06,0 0 0 50px #ffffff04}.banner-title{position:relative;z-index:1;font-size:clamp(24px,3vw,38px);font-weight:1000;letter-spacing:-1.5px;line-height:.98;text-transform:uppercase;text-shadow:0 4px 22px #000}.banner-title small{display:block;font-size:12px;letter-spacing:4px;color:#d7caff;margin-bottom:9px}.card-body{padding:17px 18px 19px}.card-name{font-size:17px;font-weight:800}.card-summary{color:#c2bfd2;font-size:13px;margin:7px 0 13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;color:#ded9f6;background:#242138;border:1px solid #37324e;padding:4px 8px;border-radius:999px}.rating{font-weight:900;color:var(--accent);font-size:14px}.empty{padding:30px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.detail-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-top:28px}.side{position:sticky;top:20px;align-self:start}.back{width:100%;text-align:left;margin-bottom:17px}.ps-cover{aspect-ratio:2/3;border-radius:13px;overflow:hidden;position:relative;padding:0;background:#11111b;border:1px solid #5a4b67;box-shadow:0 18px 45px #0008}.ps-cover .game-art{object-fit:cover;object-position:center;width:100%;height:100%}.ps-cover:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#05050b45,transparent 45%)}.ps-cover .ps-label,.ps-cover .ps-title,.ps-cover .ps-footer{display:none}.ps-label,.ps-title,.ps-footer{position:relative;z-index:1}.ps-label{font-size:10px;letter-spacing:2px;font-weight:900}.ps-title{font-size:clamp(27px,3vw,39px);font-weight:1000;line-height:.88;letter-spacing:-1.7px;text-transform:uppercase}.ps-title span{display:block;font-size:11px;letter-spacing:4px;margin-bottom:10px;color:#e6c9d5}.ps-footer{font-size:9px;letter-spacing:1px}.side-note{font-size:12px;color:var(--muted);margin-top:13px}.detail-main{min-width:0}.detail-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hero{min-height:280px;display:flex;align-items:end;padding:clamp(24px,5vw,48px);margin:18px 0 18px;border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 75% 22%,#8a4d59 0,transparent 34%),radial-gradient(ellipse at 15% 80%,#41315e 0,transparent 50%),linear-gradient(135deg,#242137,#0d0d16 80%)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#09091028,#0909109c)}.hero-content{position:relative;z-index:1}.hero h1{font-size:clamp(36px,6vw,70px);line-height:.93;letter-spacing:-3px;margin:10px 0 15px}.hero p{max-width:760px;color:#e1dce9;margin:0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0 24px}.stat,.section{background:linear-gradient(145deg,#151522,#101019);border:1px solid var(--line);border-radius:15px;padding:19px}.stat label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.section{margin:15px 0}.section h2{font-size:20px;margin:0 0 13px;letter-spacing:-.3px}.section p{white-space:pre-wrap;color:#d9d5e4;margin:0}.points{display:grid;gap:10px}.point{display:flex;gap:11px;align-items:flex-start;color:#e1deeb}.sign{width:25px;height:25px;display:grid;place-items:center;flex:0 0 25px;border-radius:8px;font-weight:900}.good .sign{background:#143a2a;color:var(--good)}.bad .sign{background:#411c2a;color:var(--bad)}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{background:#101019;border:1px solid var(--line);padding:13px;border-radius:11px}.info span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.info strong{display:block;margin-top:4px}.editor{display:grid;gap:13px}.editor label{display:grid;gap:5px;font-size:13px;color:var(--muted)}.editor input,.editor textarea,.editor select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#090910;color:var(--text)}.editor textarea{min-height:130px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.footer{padding-top:34px;text-align:center;color:#77748c;font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:170px minmax(0,1fr);gap:18px}.ps-title{font-size:29px}}
@media(max-width:620px){.shell{padding:14px 13px 40px}.header{align-items:flex-start}.grid{grid-template-columns:1fr}.banner{height:175px}.detail-layout{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}.back{grid-column:1/-1;margin:0}.ps-cover{width:90px;aspect-ratio:3/4.2;padding:7px}.ps-title{font-size:17px;letter-spacing:-.7px}.ps-title span{font-size:7px;letter-spacing:1px}.ps-label,.ps-footer{font-size:6px}.side-note{margin:0}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:12px}.stat strong{font-size:17px}.stat label{font-size:9px}.two,.info-grid{grid-template-columns:1fr}.hero{min-height:230px}.hero h1{letter-spacing:-1.8px}}

const initialGames=[{
id:"wolverine",title:"Marvel’s Wolverine",shortTitle:"Wolverine",platform:"PlayStation 5",imageUrl:"https://blog.playstation.com/uploads/2025/09/05a8d23ca19068015341a5fc2a248615a84ebb1b.png",hours:"cca 22 hodin",rating:"7,5 / 10",status:"Dohráno · Platinová trofej",developer:"Insomniac Games",publisher:"Sony Interactive Entertainment",genre:"Akční adventura",release:"",
summary:"Hru jsem si užil a dostal jsem zážitek, který jsem od ní očekával. Přesto ve mně nakonec zanechala trochu nemastný neslaný dojem a myslím si, že mohla dopadnout ještě lépe.",
review:"Marvel’s Wolverine mi přinesl přesně ten typ akčního zážitku, který jsem od hry čekal, a hraní jsem si celkově užil. Zároveň ale nejde o hru, ze které bych byl úplně nadšený. Po zkušenostech s předchozími hrami od Insomniacu jsem čekal, že některé věci budou dotaženější. Výsledkem je solidní, lehce nadprůměrný zážitek, který má výrazné silné stránky, ale také několik věcí, kvůli kterým mohl být mnohem lepší.\n\nVizuálně hra umí nabídnout opravdu povedené momenty. Některé lokace, zejména ty v Kanadě, vypadají skvěle, ale kvalita prostředí není stejně vysoká úplně všude. Wolverine jako hlavní postava funguje, souboje mají sílu a filmové scény i střety s bossy patří k zapamatovatelným částem hry. Na druhou stranu se boj postupně začne opakovat, průzkum je omezený a hra hráče často vede za ruku.\n\nPlatinovou trofej jsem získal přibližně za 22 hodin. Ve výsledku jsem rád, že jsem si hru zahrál, ale zůstává ve mně pocit, že její potenciál nebyl využitý naplno. Proto dávám 7,5/10.",
likes:["Povedená grafika a vizuální zpracování","Některé lokace, hlavně v Kanadě, vypadají skvěle","Wolverine je zábavná hlavní postava","Svižné a úderné souboje","Povedený dabing, hudba a celkové zvukové zpracování","Filmové cutscény a souboje s bossy","Dobré herecké výkony záporáků"],
dislikes:["Souboje se postupně začnou opakovat","Málo prostoru pro průzkum a objevování","Hra hráče příliš vede za ruku a je hodně lineární","Občasné bugy a glitche, i když mi zásadně nekazily zážitek","Slabší vedlejší postavy","Mise na motorce mě nebavily","QTE často nemají výraznější následky","Kvalita lokací je nevyrovnaná","Příběh je v některých momentech předvídatelný"]

},{
id:"banishers",title:"Banishers: Ghosts of New Eden",shortTitle:"Banishers",brand:"BANISHERS",platform:"PC",imageUrl:"https://cdn.akamai.steamstatic.com/steam/apps/1493640/header.jpg",coverImageUrl:"https://cdn2.steamgriddb.com/grid/f330097103ff622c360e43832544b2b5.png",hours:"34 hodin",rating:"—",status:"Dohráno",developer:"DON’T NOD",publisher:"Focus Entertainment",genre:"Akční RPG",release:"",
summary:"Atmosférické akční RPG se silným příběhem a výbornými vedlejšími úkoly, které ale v druhé polovině brzdí přehnaný backtracking a neohrabaný pohyb i souboje.",
review:"Banishers: Ghosts of New Eden jsem dohrál za 34 hodin. Zpočátku jsem plnil i většinu vedlejších úkolů, ale zhruba od poloviny na mě hra začala působit natahovaně. Největší problém je častý a někdy až přehnaný backtracking, který v kombinaci s kostrbatým pohybem postav a ne úplně šťastně řešeným rychlým cestováním brzdí tempo hry. Často jsem měl pocit, že jsem víc na cestě než v samotné akci.\n\nHra si bere hodně inspirace z God of War (2018) — od struktury světa, přes překonávání překážek až po celkový feeling soubojů. Jenže tady to není tak plynulé. Soubojový systém je místy neohrabaný a nepůsobí tak přirozeně, jak by si podobná hra zasloužila. RPG prvky jsem navíc ze začátku skoro nevnímal, protože jejich dopad je citelný spíš až později.\n\nMusím ale vyzdvihnout vedlejší úkoly — nejsou to žádné výplňové „questy do počtu“. Jsou překvapivě dobře napsané, tematicky zajímavé a často souvisí s hlavní dějovou linkou. A právě tady přichází důležité varování bez spoilerů: Ve hře je mechanika rozhodování, kde obětováváte určité postavy. Kvůli absenci jakéhokoli ukazatele ale nikdy nevíte, kolik jich už máte na kontě, přestože to zásadně ovlivňuje zakončení hry. Pokud to hráč dopředu netuší, může nedopatřením skončit úplně jiným koncem, než si celý čas budoval.\n\nAtmosféra hry je ale výborná, svět je hezky strukturovaný do několika biomů a graficky působí lehce nadprůměrně. Optimalizace mě mile překvapila a když vezmu v úvahu cenu, za kterou jsem hru koupil, dostal jsem mnohem větší a komplexnější zážitek, než jsem čekal. Příběh mě bavil, i když jsem zřejmě nedostal ten nejlepší konec — což je možná důvod si to někdy dát znovu.",
likes:["Silná atmosféra a zajímavý příběh","Velmi dobré vedlejší úkoly napojené na hlavní děj, žádná výplň","Velký herní svět rozdělený do více biomů","Spousta secretů a obsahu pro hráče, kteří rádi prozkoumávají","Důležitá rozhodnutí s reálným dopadem na finále","Solidní optimalizace","Na svou cenu překvapivě komplexní a výpravná hra","Lehce nadprůměrná grafika a hezké prostředí"],
dislikes:["Tempo se v druhé polovině docela natahuje","Až příliš backtrackingu","Pohyb je neintuitivní, plný neviditelných bariér a nalajnovaných cest","Soubojový systém je kostrbatý a méně plynulý než inspirovaný GoW 2018","Rychlé cestování je řešené nešťastně a brzdí tempo","Hra neukazuje počet obětovaných postav, přestože to zásadně ovlivňuje konec","Velké množství úkolů a postav může po čase působit zahlcujícím dojmem","Dabing postav zní tak trošku jednotvárně, ale asi jen osobní pohled"]},

{
id:"arkham-asylum",title:"Batman: Arkham Asylum",shortTitle:"Arkham Asylum",platform:"PC",imageUrl:"https://cdn.akamai.steamstatic.com/steam/apps/35140/header.jpg",hours:"7–8 hodin",rating:"8,5 / 10",status:"Dohráno",developer:"Rocksteady Studios",publisher:"Warner Bros. Interactive Entertainment",genre:"Akční adventura",release:"2009",
summary:"I po letech skvělá komiksová akce se zábavným soubojovým systémem, perfektním dabingem a výbornou optimalizací. Slabší jsou hlavně bossfighty a občasné přebíhání mezi částmi ostrova.",
review:"K Batman: Arkham Asylum jsem se vrátil po dvanácti letech, abych si znovu prošel celou arkhamovskou ságu. Dohrání mi zabralo přibližně 7 až 8 hodin. Není to nijak dlouhá hra, ale kratší herní doba mi vůbec nevadila — těch několik hodin zábavy jsem si užil.\n\nNa hru z roku 2009 vypadá Arkham Asylum pořád velmi dobře, což je znát hlavně na obličejích hlavních postav. Hra si držela krásně stabilní FPS a prakticky jsem nenarazil na žádné záseky. Jedinou výjimkou byla situace ve věži u zvonu, kdy výkon spadl téměř na 3 FPS; opakování checkpointu ale problém vyřešilo. Za zmínku stojí také PhysX efekty na páře, kouři nebo poletujících kusech papíru. Optimalizace je výborná a velkou pochvalu si zaslouží dabing Batmana i hlavních záporáků, především Jokera.\n\nPo stránce hratelnosti jde o titul, který nastavil laťku pro další hry, a nejvíc je to znát na soubojovém systému. Je zábavný, plynulý, responzivní a člověk si na něj rychle zvykne. Systém protiútoků se stal inspirací pro řadu dalších her a údery doprovází skvělé zvukové efekty. Batman je ale někdy až trochu přehnaně silný — stačí zaútočit a dokáže přeskočit skoro celou místnost, což působí zvláštně.\n\nVelkým pomocníkem je detektivní mód, díky kterému vidíte skrz překážky a můžete si plánovat další postup. Je jen na vás, jestli zvolíte stealth, nebo přímou konfrontaci; proti nepřátelům se samopaly se ale bezhlavý útok příliš nevyplácí. Batmanův opasek nabízí osm gadgetů a každý má ve hře své využití. Ostrov je rozdělený do několika částí, mezi kterými musíte přebíhat, zatímco úkoly mají poměrně pevně dané cesty. Hra tak působí jako uzavřený, spíše lineární open world. Najdete tu také spoustu hádanek a tajemství od Riddlera, z nichž některá jsou opravdu dobře schovaná.\n\nNěkolik bossfightů sice hra nabídne, ale většinou nejsou příliš náročné a závěrečný souboj na mě působil vyloženě slabě. Příběh je do určité míry očekávatelný, ale funguje jako začátek větší ságy — a právě proto se těším na Arkham City. Arkham Asylum nemám moc co vytknout kromě několika drobností. Přecházení mezi částmi ostrova může časem lézt na nervy a souboje s bossy za zbytkem hry zaostávají. Jinak mi hra nabídla přibližně sedm hodin skvělé zábavy. Hodnocení: 8,5/10.",
likes:["Zábavný, plynulý a responzivní soubojový systém","Perfektní dabing, zejména Batman a Joker","Výborná optimalizace a stabilní FPS","I po letech povedená grafika, hlavně obličeje postav","Působivé PhysX efekty: pára, kouř a poletující papíry","Detektivní mód pro plánování postupu","Užitečné gadgety a možnost kombinovat stealth s přímým bojem","Hádanky a dobře schovaná tajemství od Riddlera","Skvělé ozvučení úderů","Povedený začátek arkhamovské ságy"],

{"id":"evil-within","title":"The Evil Within","shortTitle":"The Evil Within","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/268050/header.jpg","hours":"12 hodin","rating":"8 / 10","status":"Dohráno · bez DLC","developer":"Tango Gameworks","publisher":"Bethesda Softworks","genre":"Survival horror","release":"2014","summary":"Po 12 hodinách jsem si The Evil Within pěkně užil. Skvělá atmosféra, nápadité bossfighty a nedostatek munice z něj dělají poctivý horor, i když mu občas škodí kamera, černé pruhy a natahované pasáže.","review":"Konečně jsem se dostal k dohrání The Evil Within (zatím bez DLC) a po 12 hodinách můžu říct, že jsem si hru pěkně užil.\n\nHra je z roku 2014, takže je na ní občas její stáří poznat, ale i tak je po grafické stránce velmi obstojná. Za celou dobu jsem nenarazil ani na jeden bug, glitch nebo jinou chybu. V tomhle je hra perfektní. Bodík dolů jí ale musím dát za hrozný poměr stran. Obrovské černé pruhy nahoře i dole jsem si musel vypnout až po povolení konzole. Stejně tak jsem odemkl FPS nad 30. Audio jako celek působí dobře — zvuky zbraní a monster i hudba jsou přesně takové, jaké od hororovky čekáte. Zdálo se mi ale, že se dabing občas nedokáže přizpůsobit situaci, takže v nějakém silném momentu postava prakticky jen „oddychne“. Hra je optimalizovaná na jedničku.\n\nVážně silnou stránkou hry je gameplay, který podtrhuje skvělá atmosféra! Každá zbraň v inventáři si najde uplatnění, mimo jiné proto, že munice je opravdu málo. Po celou dobu musíte přemýšlet, kolik nábojů si můžete dovolit vystřílet. Hra rozhodně netrpí tím, že se z vás od druhé poloviny stane rambo s haldou munice kolem pasu, jako se to děje v jiných hrách. Palec nahoru. Rozhodně se vyplatí prozkoumat každý kout a rozbít každou krabici. Většina lokací je zpracovaná na výbornou a společně s perfektně vymodelovanými monstry — japonská absurdita je vidět na každém kroku — vytváří hru, ve které jsem se opravdu dokázal bát. Ve hře je také spousta skvělých bossfightů, které jsou nápadité. Ne vždycky jde jen o to bosse rozstřílet!\n\nHra má i systém vylepšování. Jeho přínos je znatelný, i když se v něm najdou zbytečné možnosti. Abych nezapomněl: občas jsem měl problém s kamerou, obzvlášť při střelbě na blízko.\n\nZ příběhu jsem trochu zmatený, ale tohle bude asi jen můj problém. Uvidíme, jestli mi The Evil Within 2 pomůže některé věci vysvětlit.\n\nHru rozhodně můžu doporučit těm, kdo chtějí trochu výzvu. Málo munice není na škodu — právě tenhle aspekt z ní dělá správný horor.","likes":["Skvělá atmosféra, ve které jsem se opravdu dokázal bát","Nápadité a perfektní bossfighty","Velmi slušná grafika i audio stránka hry","Výborně vymodelovaná monstra a typická japonská absurdita","Každá zbraň má své využití díky nedostatku munice","Poctivá výzva a nutnost šetřit náboji","Výborná optimalizace a bezproblémový průběh bez bugů"],"dislikes":["Občas nešikovná kamera, hlavně při střelbě na blízko","Obrovské černé pruhy kvůli původnímu poměru stran; lze vypnout přes konzoli","Některé pasáže mohou působit zbytečně natahovaně","Dabing občas nereaguje na intenzitu situace","Příběh může být místy matoucí"]}

{"id":"prototype-2","title":"Prototype 2","shortTitle":"Prototype 2","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/115320/header.jpg","hours":"14 hodin","rating":"6,5 / 10","status":"Dohráno · všechny sběratelské předměty a vedlejší aktivity","developer":"Radical Entertainment","publisher":"Activision","genre":"Akční adventura","release":"2012",
"summary":"Skvělá zábava, když chcete vypnout hlavu a kosit všechno kolem sebe. Parádní schopnosti a gameplay ale sráží mizerná optimalizace, tragická kamera a repetitivní vedlejší mise.",
"review":"Super zábava, pokud u hry nechcete moc přemýšlet a chcete jen kosit vše okolo!\n\nNa konec dějové linky jsem se dostal za 14 hodin, ale zároveň jsem splnil všechny sběratelské předměty i vedlejší mise a aktivity. Pro pochopení souvislostí ale doporučuju odehrát první díl.\n\nNa to, že hra vyšla v roce 2012, je grafika spíš průměrná, možná lehce podprůměrná. Efekty schopností jsou povedené, dabing hlavních postav se docela povedl a filmečky vypadají dobře. Celkově je ale PC port hrozný a je vidět, že hra byla vyvíjena hlavně pro konzole. Textury mají nízké rozlišení, kamera je naprosto otřesná a největším problémem je optimalizace. Na sestavě s GTX 1070 a i5-9600K hra nedokáže udržet stabilní FPS a v mnoha scénách dochází k výrazným propadům snímkové frekvence. Abych hru vůbec spustil, musel jsem navíc z externích stránek stáhnout další soubory, jinak vyhazovala chybu. Tohle je nepřípustné.\n\nKde ale hra exceluje, je fantastický gameplay! Pět hlavních schopností, které postupně odemykáte, je podobných těm z prvního dílu, ale jsou ještě vylepšené, a přibyla i jedna nová. Vylepšování postavy funguje jinak než v jedničce: vylepšení získáváte například postupem ve vedlejších misích nebo vysáváním cílů, místo abyste si je kupovali. Časem se z vás stane nezastavitelná mašina na zabíjení a máte pocit obrovské síly, což je přesně to, co tahle hra potřebuje.\n\nVe hře je několik bossfightů, které jsou ale bohužel jednodušší než souboje s vylepšenými druhy nepřátel, a to i na HARD. Mapa je rozdělená do tří velkých částí plných aktivit. Později můžete zabrat i tank nebo vrtulník, ale to už není taková zábava. Vedlejší mise mají malou variabilitu a často se opakují — vystopovat a vysát konkrétní cíle nebo někam dojít a všechny zabít. Časem je to repetitivní a plníte je hlavně kvůli upgradům, které za to ale stojí.\n\nJe zvláštní, ale v dobrém slova smyslu, že hlavním záporákem je postava, za kterou jste hráli v prvním díle. To hráče zaujme. Vývoj příběhu je relativně očekávaný, ale najde se i pár překvapivých zvratů. Heller mi jako hlavní postava vůbec nepřišel sympatický a člověk si k němu nemá moc možnost vytvořit pouto, což je škoda.\n\nHru dost zachraňuje samotný koncept: antihrdina se superschopnostmi v plně otevřeném Manhattanu. Masakrovat všechno a všechny, plachtit a skákat po mrakodrapech je neskutečná zábava, kterou ale kazí technický stav hry a opakující se mise. I tak bych hru doporučil, protože se člověk dokáže vyblbnout a hra ho zabaví.",
"likes":["Fantastický gameplay a pocit obrovské síly","Pět hlavních schopností a jejich vylepšování","Skvělý koncept antihrdiny se superschopnostmi v otevřeném Manhattanu","Zábavné masakrování nepřátel, plachtění a skákání po mrakodrapech","Povedené efekty schopností","Solidní dabing hlavních postav a filmečky","Vedlejší aktivity přinášejí užitečné upgrady"],
"dislikes":["Velmi špatná optimalizace a výrazné propady FPS","Tragická kamera, kvůli které lze snadno zemřít","Slabší grafická stránka a nízké rozlišení textur","Repetitivní vedlejší mise","Bossfighty jsou příliš snadné i na HARD","Heller není příliš sympatický","Ke spuštění PC verze bylo nutné shánět dodatečné soubory z externích stránek"]}

{"id":"shadow-of-mordor","title":"Middle-earth: Shadow of Mordor","shortTitle":"Shadow of Mordor","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/241930/header.jpg","hours":"17 hodin","rating":"8,5 / 10","status":"Dohráno · základní hra, DLC čekají","developer":"Monolith Productions","publisher":"Warner Bros. Interactive Entertainment","genre":"Akční adventura","release":"2014",
"summary":"Po návratu do Mordoru jsem si hru užil snad ještě víc než při vydání. Skvělý soubojový systém, technické zpracování, soundtrack a Nemesis systém vyvažují slabé bossfighty a občas kostrbaté lezení.",
"review":"Hru jsem dohrál naposledy v roce 2014, když vyšla, ale zlákalo mě zahrát si ji znovu a připomenout si, co mě na ní tehdy bavilo. A užil jsem si ji snad ještě o něco víc.\n\nNa to, že už má hra nějaké roky za sebou, pořád dokáže vypadat nádherně, zejména ve druhé lokaci, kde je všechno travnaté a zbarvené do zelena. Škoda jen, že povedené cutscény mají nižší rozlišení a trochu tím ztrácejí na kráse. Hra je perfektně optimalizovaná a prošel jsem ji bez jediného záseku, propadu FPS nebo bugu. Animace chůze, běhu i soubojů jsou hezky plynulé a postava nepůsobí jako prkenný panák. Při lezení už to tak dobré není. Dabing, obzvlášť u skřetů, se povedl na jedničku a fantastický soundtrack ještě víc připomíná atmosféru Pána prstenů.\n\nGameplay je mixem Assassin’s Creed a her Batman: Arkham a tahle kombinace funguje skvěle. Dostanete se do dvou velkých lokací, které postupně odkrýváte. Vylézt se dá skoro na každou stěnu, budovu nebo skálu, což nabízí spoustu taktických možností. Soubojový systém je příjemně responzivní a postava bez prodlevy dělá to, co po ní chcete. I když je ve hře poměrně dost schopností, nemůžete si je odemknout všechny hned — některé důležité získáte až postupem příběhu.\n\nHlavní mechanikou je systém Nemesis, tedy hierarchie skřetí armády, do které zasahujete verbováním nebo zabíjením kapitánů. Mně osobně časem začal trochu vadit, protože se stává repetitivním. Zajímavé ale je, že se liší typy velitelů, kterým můžete buď čelit, nebo pomoct někomu jinému převzít jejich místo. Každý velitel má vlastní slabé a silné stránky, které je nejprve potřeba zjistit, třeba vyslechnutím informátorů. Na každého platí něco jiného, a to je super.\n\nPříběh je podle mě klasická pomsta doplněná menšími příběhy vedlejších postav. Není to nic převratného, ale ani neurazí — vyprávění je pěkně podané. Co mě naopak zklamalo, jsou bossfighty proti hlavním záporákům. Čekal jsem velkolepé souboje, ale dostal jsem víceméně jen pár quick-time eventů. Obyčejné souboje s veliteli jsou mnohem záživnější, delší a výrazně složitější.\n\nOvládání postavy někdy působí kostrbatě, hlavně při lezení. Pokud přesně nezmáčknete směrovou klávesu nebo joystick, postava vás nemusí poslouchat. Přechod na zábradlí nebo úskok na protější římsu se tak často mění v boj o nervy.\n\nPolovinu hry jsem se snažil sbírat všechny collectibles a plnit výzvy, takže jsem se dostal na zhruba 17 hodin herního času. Jde pouze o základní hru — DLC mě ještě čekají.",
"likes":["Skvělé technické zpracování a výborná optimalizace","Responzivní a zábavný soubojový systém","Parádní soundtrack a atmosféra Pána prstenů","Systém Nemesis jako výborný nápad","Možnost lézt téměř všude a využívat terén takticky","Schopnosti Celebrimbora","Souboje s kapitány a jejich rozdílné slabiny a silné stránky","Plynulé animace a povedený dabing, zejména skřetů"],
"dislikes":["Bossfighty proti hlavním záporákům jsou příliš jednoduché, slabší než běžné souboje s veliteli","Občas kostrbaté ovládání, především při lezení","Systém Nemesis se časem může stát repetitivním","Cutscény mají nižší rozlišení než zbytek hry"]}

{"id":"rise-of-the-tomb-raider","title":"Rise of the Tomb Raider","shortTitle":"Rise of the Tomb Raider","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/391220/header.jpg","hours":"17 hodin","rating":"8,5 / 10","status":"Dohráno","developer":"Crystal Dynamics","publisher":"Square Enix","genre":"Akční adventura","release":"2015",
"summary":"Oproti prvnímu rebootu jde o výrazný posun: nádherná grafika, skvělé animace, nové mechaniky a rozsáhlý průzkum. Dobrodružství ale postupně ztrácí survival nádech a až příliš okatě vede hráče za ruku.",
"review":"Po prvním rebootu Lary, který jsem dohrál těsně před tímhle dílem, jsem čekal, že Rise of the Tomb Raider bude i přes doslechnuté informace lepší. A moje očekávání se naplnila — ba co víc, hra je ještě předčila!\n\nGrafický posun oproti prvnímu dílu je neskutečný. Ať už jde o zasněžené, písčité, nebo podzemní lokace, všechno vypadá fantasticky i po letech. Velkou roli v tom hraje nasvícení: světlo tu funguje parádně a obyčejná glowstick dokáže z tmavé jeskyně udělat krásnou podívanou. Animace obličejů, především Lary, jsou špičkové — věříte jí každou emoci a lip-sync působí jako z filmu. Dabing postav byl už v prvním díle na vysoké úrovni a tady tomu není jinak. Hra je skvěle optimalizovaná a i na mé GTX 1070 běžela na velmi vysoké detaily s pár vypnutými zbytečnostmi.\n\nHra se posunula k jakémusi „open worldu“. Dostanete tři nebo čtyři velké lokace k prozkoumávání a k tomu hromadu menších, které je propojují. Velké oblasti navíc ukrývají další menší i větší lokace v podobě hrobek, krypt a jeskyní. Gameplay mě bavil výrazně víc než v prvním díle: přibylo vybavení, zbraně, nové mechaniky a hlavně vedlejší mise. Vylepšování postavy pomocí skillpointů zůstalo a podle mě má větší dopad na hratelnost. Hádanky nejsou nijak extrémně těžké, ale u několika z nich — a je jich dost — jsem se zapotil. Pokud rádi sbíráte předměty a prozkoumáváte, můžete tu strávit hodiny hledáním kešek, relikvií a dalších věcí. Umělá inteligence je průměrná: někdy nepřátelé stojí jako blbci, jindy vás pronásledují, i když vás už nemohou vidět.\n\nI když se hra tváří jako open world, docela vás vede za nos. Přístupové cesty a římsy jsou označené bílou nebo červenou barvou, takže prostředí působí uměle a člověk ani nemá potřebu cestu hledat. Celkově je hra až moc připravená na váš postup. Výbušné sudy, petrolejové lampy i samotný směr cesty jsou nastražené příliš okatě. Hra už také nemá tak silný survival nádech jako první díl: munice i surovin na výrobu šípů, lékárniček nebo speciální munice je dostatek. Často se tak cítíte jako terminátor, který všechno vykosí, což je škoda.\n\nKonec celkem zajímavého příběhu jsem si prostřílel a proskákal za zhruba 17 hodin. Od poslední čtvrtiny hry jsem už trochu kašlal na prozkoumávání každého kouta kvůli dokumentům a dalším drobnostem. Za 9 euro v nejlepší edici hru rozhodně doporučuju, nejlépe ale společně s původním dílem.",
"likes":["Skvělé technické zpracování a nádherná grafika","Působivé nasvícení prostředí a povedené animace obličejů","Velmi dobrý dabing a lip-sync","Výborná optimalizace i na starším hardwaru","Nové mechaniky, zbraně a vybavení","Vylepšování postavy má znatelný vliv na hratelnost","Rozsáhlé lokace, hrobky, krypty, jeskyně a sběratelské předměty","Vedlejší mise a zajímavé hádanky","Celkově poutavý příběh"],
"dislikes":["Od druhé poloviny je hra výrazně jednodušší","Cesty, římsy a interaktivní prvky jsou až příliš okatě označené","Prostředí často působí připraveně tak, aby hráče co nejjednodušeji vedlo","Slabší survival pocit kvůli velkému množství munice a surovin","Umělá inteligence je jen průměrná"]}

{"id":"alan-wake","title":"Alan Wake","shortTitle":"Alan Wake","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/108710/header.jpg","hours":"10 hodin","rating":"7 / 10","status":"Dohráno","developer":"Remedy Entertainment","publisher":"Microsoft Game Studios","genre":"Akční adventura / psychologický thriller","release":"2010",
"summary":"Silná hororová atmosféra Bright Falls, příběh, který je potřeba prožít, a skvěle využitá baterka dělají z Alana Wakea zábavné dobrodružství i přes stáří a kolísající obtížnost.",
"review":"Alan Wake byl ve své době takovou malou revolucí, i když jsem úplně nechápal proč. Hra mi nabídla zhruba 10 hodin a můžu říct, že jsem si je všechny užil.\n\nGameplay je dost lineární, což se ale u takové hry dá čekat. Hra vás vede za ruku až moc okatě — všechny cíle jsou na minimapě vyznačené žlutou tečkou, takže se nestane, že byste si něco museli poctivě najít.\n\nHlavní pilíř hry, světlo, funguje perfektně! Konečně hra, ve které je baterka opravdu k užitku a vlastně vás drží při životě. Nepřátele musíte nejdřív oslabit světlem a teprve potom na ně platí zbraně. Je to parádní prvek, díky kterému musíte dávat pozor. Souboje jsou tím pádem náročnější, což je jedině dobře. Všechny zbraně jsou užitečné a budete je střídat jak na běžícím páse. Hra ale v první polovině trochu trpí balancem obtížnosti: i obyčejný nepřítel vydrží čtyři rány a munice ze začátku moc není. Dostal jsem se i do situace, kdy jsem neměl vůbec nic a musel jsem k cíli jen utíkat a pomáhat si baterkou. Zhruba od třetiny hry jsem si naopak připadal jako nezastavitelná mašina, protože na každém rohu ležely světlice nebo náboje. Najde se i pár pasáží za volantem, většinou ale jde jen o kratší doplnění hratelnosti.\n\nHra už má svoje roky a je to vidět, ale to neznamená, že patří do šrotu. Animace obličejů, především při mluvení, jsou překvapivě dobré a působí důvěryhodně. To samé platí pro předělové filmečky — když člověk přehlédne slabší grafiku, působí skoro jako z filmu. Prostředí amerického horského venkova je zpracované na výbornou. V kombinaci s temnou hororovou atmosférou Bright Falls není co vytknout. Atmosféru navíc podtrhuje skvělé, místy opravdu hodně strašidelné ozvučení nepřátel i samotného prostředí.\n\nPříběh je něco, co si budete muset prožít na vlastní kůži. Pokud se do něj zakousnete, nebudete zklamaní!\n\nZa zhruba 10 hodin jsem si užil silnou atmosféru, příběh i zábavné souboje. Optimalizace je vzhledem ke stáří hry také povedená.",
"likes":["Skvělá hororová atmosféra Bright Falls","Příběh, který vtáhne, když se do něj ponoříte","Zábavný gunplay a chytré využití světla","Všechny zbraně mají své využití","Překvapivě dobré animace obličejů a filmové předělové scény","Výborné ozvučení nepřátel i prostředí","Dobrá optimalizace"],
"dislikes":["Obtížnost je nevyvážená a s postupem hry výrazně klesá","Lineární postup a cíle příliš okatě vyznačené na minimapě","Některé pasáže jsou zbytečně natahované","Občas zlobí ovládání postavy"]}

{"id":"dishonored","title":"Dishonored","shortTitle":"Dishonored","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/205100/header.jpg","hours":"12 hodin","rating":"9 / 10","status":"Dohráno · základní hra bez DLC","developer":"Arkane Studios","publisher":"Bethesda Softworks","genre":"Akční adventura / stealth","release":"2012",
"summary":"Výborně navržená stealth akce, která nechává hráče volit vlastní styl, nabízí nelineární lokace, užitečné schopnosti a několik konců ovlivněných vašimi činy.",
"review":"Základní hru Dishonored bez DLC jsem dokončil za nějakých 12 hodin, což jsem před rozehráním vůbec nečekal, takže mě to mile překvapilo.\n\nHra má zajímavě stylizovanou grafiku, takovou lehce cartoonovou až kreslenou. To ale neznamená, že tu nepoteče krev nebo nebudou lítat hlavy. Hra se tím krásně odlišuje a působí originálně.\n\nHlavním stavebním kamenem je určitě gameplay, a ten je špičkový. Hra vás vyloženě nenutí do jednoho herního stylu, takže můžete lokace projít jako tichý assassin, nebo jako mašina na zabíjení. Tomu nahrává i samotné procházení úrovní — není tak lineární, jak by se mohlo zdát. Na místo určení se dá dostat několika cestami, takže se vyplatí využívat vertikalitu prostředí. Hlavní i spoustu vedlejších úkolů lze splnit různými způsoby a některé z nich odemykají i achievementy. Vedlejší mise jsou různorodé a často vyžadují prolézt každý kout lokace. Korunu tomu nasazují speciální schopnosti, které budete využívat prakticky pořád a jsou opravdu užitečné — i když ne všechny. Vylepšování schopností pomocí run, které hledáte ve světě, má znatelný dopad na průběh hry. Pokud máte dost fantazie, existuje nespočet způsobů, jak jejich pomocí likvidovat nepřátele. Ti jsou navíc až překvapivě chytří a mnohdy vám dokážou pořádně zatopit.\n\nPříběh má několik konců a o tom, který uvidíte, rozhoduje váš přístup k nepřátelům. To je neskutečná věc. Čím více mrtvol za sebou necháte, tím temnější bude svět kolem vás, takže postupujte s rozvahou. Nechci o příběhu moc mluvit — každý si ho musí projít na vlastní kůži.\n\nNějaké zápory bych našel, ale jde spíš o osobní preference. Grafika je sice zajímavá, ale mně tenhle styl moc nesedí. Některé schopnosti jsem za celou dobu skoro nepoužíval, maximálně na vyzkoušení, takže jsem za ně zbytečně utrácel runy. Souboje na blízko jsou trochu kostrbaté. Krytí sice funguje, ale dosah meče je občas nepochopitelný — někdy to ani nevypadá, že na vás nepřítel může dosáhnout. Bossfightů je navíc pomálu a i ty jsou hrozně lehké.\n\nI přes tyhle výhrady je Dishonored parádní hra, která dává hráči svobodu a odměňuje experimentování. Za mě 9/10.",
"likes":["Originální, stylizovaná grafika","Špičkový gameplay a svoboda volby herního stylu","Nelineární lokace s více cestami a důrazem na vertikalitu","Hlavní i vedlejší úkoly lze řešit různými způsoby","Schopnosti a jejich vylepšování pomocí run výrazně ovlivňují hratelnost","Chytrá AI nepřátel","Několik konců ovlivněných hráčovým přístupem k zabíjení"],
"dislikes":["Některé pasáže mohou být občas zbytečně natahované","Ne všechny schopnosti mají v praxi využití","Souboje na blízko působí někdy kostrbatě a dosah meče je nejasný","Bossfightů je málo a jsou příliš jednoduché","Vizuální styl nemusí sednout každému"], "coverImageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/205100/library_600x900.jpg"}

{"id":"call-of-duty-wwii","title":"Call of Duty: WWII","shortTitle":"Call of Duty: WWII","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/476600/header.jpg","hours":"necelých 8 hodin","rating":"7 / 10","status":"Dohráno · kampaň","developer":"Sledgehammer Games","publisher":"Activision","genre":"FPS","release":"2017",
"summary":"Kampaň nabízí špičkové technické zpracování, působivou atmosféru druhé světové války a užitečné schopnosti spolubojovníků. Příběh je spíš průměrný a mise se drží klasické lineární šablony Call of Duty.",
"review":"Co k tomu říct… Prostě kampaň Call of Duty. Dohráno za necelých osm hodin a můžu říct, že jsem si hru docela užil.\n\nVizuál i audio jsou na špičkové úrovni a fakt jsem se chvílemi jen zastavil na místě a koukal kolem sebe. Mimika obličejů dodává emocím na důvěryhodnosti. Výbuchy, střelba i zvuky v pozadí se krásně poslouchají. I když je příběh takové průměrné béčko, díky skvěle zpracované atmosféře druhoválečného období vám to bude tak nějak jedno.\n\nHra má několik pasáží, kdy se z pozice klasického pěšáka dostanete za dělo tanku, a to bylo super osvěžení. Gunplay je klasické Call of Duty, takže žádné překvapení. Co jsem ale nečekal, bylo to, že spolubojovníci, od kterých si můžete vyžádat lékárničku, náboje nebo průzkum terénu, budou opravdu užiteční.\n\nHra je opět striktně lineární, takže postup v misích spočívá v postupném čištění „arén“ a po dokončení hurá do další. To jí ale nelze zazlívat, protože na tom stojí každý díl. Našlo se ovšem pár misí, které mi pořádně zatopily pod kotlem a musel jsem je opakovat několikrát, protože zbraně nepřátel fakt umí kousnout.",
"likes":["Špičkové technické zpracování","Působivá atmosféra druhé světové války","Skvělé vizuální zpracování a mimika obličejů","Výborné zvuky výbuchů, střelby i prostředí","Pasáže s tankem a dalšími silnějšími zbraněmi","Mise v různých denních dobách","Užitečné schopnosti spolubojovníků"],
"dislikes":["Klasická lineární struktura misí: vyčistit arénu a pokračovat dál","Nepřátelé nejsou příliš chytří","AI spolubojovníků občas pokulhává","Příběh příliš nezaujme","Obtížnost některých misí může nutit k opakování"]}

{"id":"tomb-raider-2013","title":"Tomb Raider (2013)","shortTitle":"Tomb Raider","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/203160/header.jpg","hours":"cca 8 hodin · 67 % dokončeno","rating":"—","status":"Dohráno","developer":"Crystal Dynamics","publisher":"Square Enix","genre":"Akční adventura","release":"2013",
"summary":"Skvělý soubojový systém, povedený vizuál a vyvážená obtížnost dělají z rebootu zábavné dobrodružství. Temnější atmosféra a velké množství lezení ale nemusí sednout každému.",
"review":"Tomb Raider jsem dohrál za nějakých osm hodin, a to při 67% dokončení. Moc jsem se nesoustředil na kešky a další serepetičky.\n\nHra má na svou dobu super vizuál. Najdou se výjimky, ale jde jen o chvilkové záležitosti. Moc mi nesedl temný nádech ostrova — všechno je takové tmavé. Tomb Raider byl vždycky o barevné škále, ale chápu, že to souvisí s příběhem.\n\nCombat je parádní, uspokojující a i přes střední obtížnost jsem docela často umíral, takže si myslím, že hra našla hezký balanc obtížnosti. Příběh je… fajn. Moc mě neuchvátil, ale zase ani neurazil. Obecně je gameplay parádní a quick-time eventů není přehršel, takže neomrzí. Jen toho lezení by nemuselo být tolik.\n\nDohrál jsem to s delšími pauzami, ale i tak bych hru určitě doporučil!",
"likes":["Na svou dobu skvělý vizuál","Parádní, uspokojující soubojový systém","Dobře vyvážená obtížnost, která dokáže potrápit","Zábavný gameplay","Quick-time eventů není přehnaně mnoho","Povedené zpracování ostrova a atmosféry"],
"dislikes":["Temná barevná paleta nemusí sednout každému","Příběh příliš neuchvátí, i když neurazí","Lezení je místy až příliš časté"]}

{"id":"prototype-2009","title":"Prototype","shortTitle":"Prototype","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/10150/header.jpg","coverImageUrl":"https://media.online-station.net/images/2025/06/ac92f1976b3c467695f45ac0131104e7.jpg","hours":"cca 9 hodin","rating":"6 / 10","status":"Dohráno","developer":"Radical Entertainment","publisher":"Activision","genre":"Akční adventura","release":"2009",
"summary":"Skvělá akční řežba s efektními schopnostmi, parádním pohybem a pocitem ničivé síly. Zastaralé zpracování, kostrbaté ovládání, problematická kamera a místy nefér obtížnost ale zážitek citelně srážejí.",
"review":"Prototype jsem dohrál přibližně za devět hodin. Držel jsem se hlavně hlavní příběhové linky, protože vedlejší náplně tu není zrovna moc. Kromě příběhových misí jsou ve světě hlavně časové výzvy — parkourové nebo zaměřené na zabíjení. Ze začátku jsem jich pár splnil, abych získal body na vylepšení, ale jinak mě vůbec nebavily. Chápu, o co se hra snaží, jenže jako výplň otevřeného světa mi tyhle opakované výzvy moc nesedí.\n\nNa hře je její věk znát. Textury nevypadají příliš dobře, animace jsou zastaralé a ani filmečky nebo dabing dnes nijak neohromí. Také jsem musel řešit problémy se spuštěním na moderním počítači a pomoci si modem. Hra ale naštěstí stojí především na gameplayi — a ten je pořád skvělý.\n\nMáte k dispozici hromadu schopností, které nejen vypadají odlišně, ale také se s nimi jinak bojuje. Jejich vylepšení jsou v soubojích znát a speciální útoky vypadají opravdu efektně. Některé schopnosti jsem skoro nepoužíval a příběh jsem dohrál dřív, než jsem všechny vylepšil na maximum, ale i tak je z čeho vybírat.\n\nPohyb po New Yorku je fantastický. Můžete šplhat po budovách, skákat z obrovských výšek a při dopadu na zem vytvářet parádní tlakovou vlnu. Právě tenhle pocit ničivé síly mi v jiných hrách často chybí. Prototype vám dává pocit, že jste naprostý motherfucker — spíš antihrdina než klasický superhrdina. K tomu se přidává možnost ovládat tanky a vrtulníky, které se hodí i v některých misích.\n\nPříběh je poměrně klišovitý: stane se vám něco hrozného, nepamatujete si přesně co a postupně odhalujete, co se vlastně děje, až nakonec porazíte hlavního padoucha. Žádné velké překvapení. Jenže u téhle hry jde hlavně o běhání, mlácení, kosění nepřátel a ničení všeho kolem.\n\nSouboje ale mají i své velké problémy. Ovládání na gamepadu je strašně kostrbaté a občas jsem měl pocit, že mě postava vůbec neposlouchá. Kamera navíc často zlobí a v kombinaci s tímhle ovládáním dokáže souboje pořádně znepříjemnit. Hra nemá klasický krycí systém, takže se musíte spoléhat na úskoky, které ale nefungují zrovna spolehlivě.\n\nA to je problém hlavně kvůli obtížnosti. I na normální nastavení byla hra místy pořádný masakr. Elitnější nepřátelé, především Huntři, jsou extrémně nepříjemní a souboje s nimi dokážou být spíš frustrující než zábavné.\n\nKdyž jsem Prototype hrál poprvé v roce 2009, byl jsem z něj naprosto unešený. I dnes ho považuji za skrytý klenot, který bohužel nejspíš třetí díl nedostane. Je to skvělá zábava pro každého, kdo chce vypnout hlavu a pořádně si zařádit — pokud se dokáže přenést přes jeho technické a ovládací nedostatky. S moderními technologiemi by tahle série mohla být naprostý masakr.",
"likes":["Skvěle zpracovaný pohyb a průzkum města","Spousta odlišných a efektních schopností","Pocit ničivé síly a parádní tlakové vlny při dopadech","Vylepšování schopností má znatelný dopad na souboje","Možnost používat tanky a vrtulníky","Čistokrevná akční zábava a výrazná power fantasy"],
"dislikes":["Zastaralá grafika a textury","Slabší animace, filmečky a dabing","Příběh je poměrně klišovitý a nijak zvlášť propracovaný","Některé schopnosti jsem téměř nevyužil","Problémy se spuštěním na moderním PC","Vedlejší časové výzvy zaměřené na parkour a zabíjení jsou repetitivní a nebavily mě","Kostrbaté ovládání na gamepadu a postava občas nereaguje správně","Kamera často zlobí a zhoršuje přehled v soubojích","Úskoky jako hlavní způsob obrany fungují nespolehlivě","Místy přehnaná obtížnost i na normální úroveň, hlavně proti Huntřům"]}

{"id":"space-marine-2","title":"Warhammer 40,000: Space Marine 2","shortTitle":"Space Marine 2","brand":"SPACE MARINE 2","platform":"PC","imageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/2183900/header.jpg","coverImageUrl":"https://cdn.akamai.steamstatic.com/steam/apps/2183900/library_600x900.jpg","hours":"cca 8 hodin","rating":"","status":"Dohráno","developer":"Saber Interactive","publisher":"Focus Entertainment","genre":"Akční hra z pohledu třetí osoby","release":"9. 9. 2024","summary":"Monumentální a audiovizuálně působivá řežba, ve které se člověk cítí jako chodící tank. Kampaň baví brutálními souboji a skvělým měřítkem prostředí, ale její lineární průchod od arény k aréně a minimum průzkumu brzy ukážou své limity.","review":"Warhammer 40,000: Space Marine 2 jsem dohrál už před nějakou dobou, takže si příběh samotný nevybavuju do detailu. Kampaň mi ale zanechala dojem hlavně díky tomu, jak skvěle dokáže prodat svět Warhammeru 40,000. Pokud znáte jeho lore, nejspíš si řadu souvislostí užijete víc; já se možná někdy vrátím i k prvnímu Space Marineovi, ke kterému jsem se zatím nedostal.\n\nTo, co mě na druhém dílu zaujalo nejvíc, je audiovizuální stránka a obrovské měřítko prostředí. V dálce se tyčí gigantické stavby, kolem jsou monumentální komplexy a vesmírné lodě, díky kterým člověk opravdu cítí, jak obrovský a nehostinný tenhle svět je. Výborně působí i detaily jednotlivých lokací, základny mariňáků a jejich zbrojí. Když má člověk grafiku nastavenou naplno, je na co koukat. Zvuk je rovněž skvělý a celému masakru dodává pořádnou váhu. Filmové scény mi ale nepřišly tak působivé jako samotné hraní a myslím, že mohly být zpracované lépe.\n\nSamotný gameplay je návykový. Space Marine se pohybuje těžkopádně, ale přesně to k němu sedí: nemáte pocit, že ovládáte obyčejného vojáka, ale chodící tank, kterého se ostatní postavy očividně mají důvod bát a respektovat ho. Hra vám umí dát pocit, že jste na bojišti někdo opravdu výjimečný. Zbraní je několik druhů, od těžkých pistolí a automatických zbraní až po pořádné kulomety. Mně nejvíc sedlo kladivo. Je pomalejší, ale údery vypadají skvěle a mají ten správný pocit síly.\n\nKampaň je však hodně přímočará. Většinou postupujete jednou trasou od jedné arény k další a likvidujete vlny nepřátel. Na exploraci tu skoro není prostor; můžete narazit na sběratelské předměty, ale průzkum pro mě nebyl důvodem, proč pokračovat dál. Souboje jsou zábavné a i na střední obtížnost umí větší střety potrápit, jenže struktura misí se časem začne opakovat. Tahle hra zkrátka sází hlavně na intenzivní akci, ne na objevování.\n\nKampaň navíc představuje jen část celého balíku. Po jejím dohrání se dá detailněji upravovat vzhled mariňáka a editor nabízí spoustu pěkných možností, jenže řada kosmetických předmětů je zamčená za placeným obsahem. Zkoušel jsem také několik PvE misí, ve kterých se odemykají zbraně, jejich vylepšení a další třídy. Tyhle mise jsou oddělené od kampaně a právě kooperativní obsah dává důvod se ke hře vracet na mnohem delší dobu. Když v týmu chybí jeden hráč, je to v boji znát a mise mohou být citelně těžší. PvP je další součástí hry, ale nemám ho nahráno dost na to, abych ho mohl pořádně hodnotit.\n\nNa mém PC hra většinu času běžela dobře a vizuální kvalita za to stojí. Při opravdu velkých bitvách s množstvím nepřátel se ale občas zadýchala i s FSR. Za celou dobu jsem zažil možná dva pády, takže celkově nemám pocit, že by technický stav byl vyloženě špatný; nechci ale tvrdit, jestli za propady může hra, procesor, nebo kombinace obojího. Pozitivní je, že vývojáři hru dál podporují aktualizacemi a její multiplayer má prostor dál růst.\n\nSpace Marine 2 je pro mě především skvěle vypadající a zvukově působivá akční řežba, která umí z obyčejného boje udělat monumentální podívanou. Její největší slabinou je lineární kampaň s minimem průzkumu a opakující se arénovou strukturou. Pokud čekáte otevřenější dobrodružství, tady ho nenajdete. Pokud ale chcete zažít, jaké to je být obrněnou mašinou, která se prosekává hordami nepřátel, hra tohle umí prodat výborně.","likes":["Monumentální měřítko prostředí, obří stavby a lodě v dálce","Výborné audiovizuální zpracování a skvělý zvuk","Velké množství detailů v lokacích, na základně i na zbrojích mariňáků","Pocit síly a těžkopádné, ale tematicky přesvědčivé ovládání Space Marina","Zábavné souboje a efektní zbraně; kladivo je pomalé, ale údery vypadají skvěle","Velké bitvy proti hordám nepřátel","Kooperativní PvE mise, odemykání zbraní, vylepšení a tříd","Detailní možnosti kosmetického přizpůsobení mariňáka","Vývojáři hru dál podporují aktualizacemi","Věrné zachycení grimdark atmosféry a ikonické estetiky Warhammeru 40,000","Efektní hordy Tyranidů a technologie, díky které bojiště působí opravdu obrovsky","Krvavé popravy a souboje zblízka, které zdůrazňují brutalitu mariňáků"],"dislikes":["Kampaň je velmi lineární a vede od jedné arény k další","Průzkum prostředí je téměř nulový a sběratelské předměty nejsou velkou motivací","Struktura kampaně se postupně opakuje","Filmové scény mohly být zpracované lépe","Část kosmetických úprav je zamčená za placeným obsahem","Při velkých bitvách se hra občas zadýchá i s FSR","V kooperativních PvE misích je citelně znát, když v týmu chybí hráč","Soubojový systém může působit nevyrovnaně: načasování parírování není vždy čitelné a některé střety jsou chaotické","Opakující se bojové situace a úkoly typu ubránit pozici nebo přežít další vlnu nepřátel","Pozdější střety s odolnějšími nepřáteli mohou ztrácet tempo a působit únavně"]}

function editor(g){return '<div class="detail-layout"><aside class="side"><button class="back" id="cancelBack">← Zpět na recenzi</button><div class="ps-cover">'+(g.coverImageUrl||g.imageUrl?'<img class="game-art" src="'+esc(g.coverImageUrl||g.imageUrl)+'" alt="'+esc(g.title)+' cover art">':'<div class="ps-title">'+esc(g.title)+'</div>')+'</div></aside><section class="detail-main section"><h2>Upravit hru a recenzi</h2><form id="form" class="editor"><label>Název hry<input name="title" required value="'+esc(g.title)+'"></label><label>URL širokého obrázku (seznam a recenze)<input name="imageUrl" value="'+esc(g.imageUrl||"")+'" placeholder="https://…"></label><label>URL obálky (portrét vlevo)<input name="coverImageUrl" value="'+esc(g.coverImageUrl||"")+'" placeholder="https://…"></label><div class="two"><label>Platforma<input name="platform" value="'+esc(g.platform)+'"></label><label>Herní doba<input name="hours" value="'+esc(g.hours)+'"></label></div><div class="two"><label>Hodnocení<input name="rating" value="'+esc(g.rating)+'"></label><label>Stav<input name="status" value="'+esc(g.status)+'"></label></div><div class="two"><label>Vývojář<input name="developer" value="'+esc(g.developer)+'"></label><label>Vydavatel<input name="publisher" value="'+esc(g.publisher)+'"></label></div><label>Krátké shrnutí<textarea name="summary">'+esc(g.summary)+'</textarea></label><label>Moje kompletní recenze / verdikt<textarea name="review">'+esc(g.review)+'</textarea></label><label>Co se mi líbilo — každý bod na nový řádek<textarea name="likes">'+esc((g.likes||[]).join('\n'))+'</textarea></label><label>Co mi vadilo — každý bod na nový řádek<textarea name="dislikes">'+esc((g.dislikes||[]).join('\n'))+'</textarea></label><div class="actions"><button class="primary" type="submit">Uložit změny</button><button type="button" id="cancelBtn">Zrušit</button><button type="button" id="deleteBtn">Smazat hru a recenzi</button></div><p class="tagline">Poznámka: úpravy v tomto formuláři se ukládají jen function settingsPanel(){return '<section class="section settings-panel"><h1 class="page-title">Upravit texty stránky</h1><p class="intro">Tady si přepíšeš nápisy, které se zobrazují na stránce. Změny se uloží do tohoto prohlížeče.</p><form id="settingsForm" class="editor"><label>Hlavní název v horní liště<input name="brand" required value="'+esc(siteSettings.brand)+'"></label><label>Menší text pod názvem<input name="tagline" value="'+esc(siteSettings.tagline)+'"></label><label>Malý nápis vpravo nahoře<input name="topLabel" value="'+esc(siteSettings.topLabel)+'"></label><label>Hlavní nadpis knihovny<input name="libraryTitle" required value="'+esc(siteSettings.libraryTitle)+'"></label><label>Podtitul knihovny<textarea name="librarySubtitle">'+esc(siteSettings.librarySubtitle)+'</textarea></label><label>Text v patičce stránky<input name="footer" value="'+esc(siteSettings.footer)+'"></label><div class="actions"><button class="primary" type="submit">Uložit texty</button><button type="button" id="cancelSettings">Zrušit</button><button type="button" id="resetSettings">Vrátit výchozí texty</button></div><p class="tagline">Pozor: toto nastavení se ukládá jen v tomto prohlížeči. Ostatním návštěvníkům veřejného webu se změny nepropíšou.</p></form></section>'}
function removeSelectedGame(){const g=games.find(x=>x.id===selected);if(!g)return;if(!confirm('Opravdu chceš odstranit hru „'+g.title+'“ i celou její recenzi z této knihovny? Tuto akci nelze vrátit.'))return;games=games.filter(x=>x.id!==selected);selected=games[0]?.id||null;view="library";editing=false;persist()}
function bind(){bindCardDragging();const settingsBtn=$("settingsBtn");if(settingsBtn)settingsBtn.onclick=()=>{view="settings";render();window.scrollTo({top:0,left:0,behavior:"instant"})};const settingsForm=$("settingsForm");if(settingsForm)settingsForm.onsubmit=e=>{e.preventDefault();const d=new FormData(settingsForm);Object.keys(defaultSiteSettings).forEach(k=>siteSettings[k]=String(d.get(k)||"").trim());localStorage.setItem(settingsKey,JSON.stringify(siteSettings));view="library";render();window.scrollTo({top:0,left:0,behavior:"instant"})};const cancelSettings=$("cancelSettings");if(cancelSettings)cancelSettings.onclick=()=>{view="library";render()};const resetSettings=$("resetSettings");if(resetSettings)resetSettings.onclick=()=>{siteSettings={...defaultSiteSettings};localStorage.setItem(settingsKey,JSON.stringify(siteSettings));render()};document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{selected=b.dataset.open;view="detail";editing=false;render();window.scrollTo({top:0,left:0,behavior:"instant"})});const back=$("backBtn");if(back)back.onclick=()=>{view="library";editing=false;render();window.scrollTo({top:0,left:0,behavior:"instant"})};const edit=$("editBtn");if(edit)edit.onclick=()=>{editing=true;render()};const del=$("deleteBtn");if(del)del.onclick=removeSelectedGame;const add=$("addBtn");if(add)add.onclick=()=>{const g={id:"game-"+Date.now(),title:"Nová hra",shortTitle:"Nová hra",platform:"",hours:"",rating:"",status:"Rozehráno",developer:"",publisher:"",genre:"",release:"",summary:"",review:"",likes:[],dislikes:[]};games.unshift(g);selected=g.id;view="detail";editing=true;render()};const search=$("search");if(search)search.oninput=()=>{const q=search.value.toLowerCase();document.querySelectorAll("[data-open]").forEach(b=>b.style.display=b.innerText.toLowerCase().includes(q)?"":"none")};const cancel=$("cancelBtn");if(cancel)cancel.onclick=()=>{editing=false;render()};const cancelBack=$("cancelBack");if(cancelBack)cancelBack.onclick=()=>{editing=false;render()};const form=$("form");if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);const g=games.find(x=>x.id===selected);["title","platform","hours","rating","status","developer","publisher","summary","review","imageUrl","coverImageUrl"].forEach(k=>g[k]=String(d.get(k)||"").trim());g.shortTitle=g.title.replace(/^Marvel[’']s\\s*/i,"");g.likes=String(d.get("likes")||"").split('\n').map(s=>s.trim()).filter(Boolean);g.dislikes=String(d.get("dislikes")||"").split('\n').map(s=>s.trim()).filter(Boolean);editing=false;persist()}}

function applyGameTheme(){const theme=view==="library"?null:gameThemes[selected];const root=document.documentElement;const chosen=theme||{accent:"#a78bfa",accent2:"#e879f9",glow:"#30204b"};root.style.setProperty("--accent",chosen.accent);root.style.setProperty("--accent2",chosen.accent2);root.style.setProperty("--glow",chosen.glow);}
function render(){applyGameTheme();$("brandText").innerHTML=esc(siteSettings.brand).replace(/GAME VLOG|GAME LOG/g,m=>"<span>"+m+"</span>");$("taglineText").textContent=siteSettings.tagline;$("topLabel").textContent=siteSettings.topLabel;$("footerText").textContent=siteSettings.footer;document.title=siteSettings.brand.replace(/^🎮\\s*/,"")+" — "+siteSettings.libraryTitle;const app=$("app");if(view==="library"){app.innerHTML=library()}else if(view==="settings"){app.innerHTML=settingsPanel()}else{const g=games.find(x=>x.id===selected);app.innerHTML=g?(editing?editor(g):detail(g)):'<button id="backBtn">← Zpět do seznamu her</button>'; }bind()}
function bindCardDragging(){const cards=[...document.querySelectorAll(".card[data-card-id]")];let draggedId=null;let moved=false;if(!window.__gameDragWheelBound){document.addEventListener("wheel",e=>{if(window.__gameCardDragging){e.preventDefault();window.scrollBy({top:e.deltaY,left:0,behavior:"auto"});}}, {passive:false});window.__gameDragWheelBound=true;}cards.forEach(card=>{card.addEventListener("dragstart",e=>{draggedId=card.dataset.cardId;window.__gameCardDragging=true;moved=false;card.classList.add("dragging");if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggedId);}});card.addEventListener("dragover",e=>{if(window.__gameCardDragging){const edge=85;if(e.clientY<edge)window.scrollBy({top:-Math.max(8,Math.round((edge-e.clientY)*.32)),left:0,behavior:"auto"});else if(e.clientY>window.innerHeight-edge)window.scrollBy({top:Math.max(8,Math.round((e.clientY-(window.innerHeight-edge))*.32)),left:0,behavior:"auto"});}if(!draggedId||card.dataset.cardId===draggedId)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";cards.forEach(c=>c.classList.toggle("drag-over",c===card));});card.addEventListener("dragenter",e=>{if(draggedId&&card.dataset.cardId!==draggedId){e.preventDefault();card.classList.add("drag-over");}});card.addEventListener("dragleave",e=>{if(!card.contains(e.relatedTarget))card.classList.remove("drag-over");});card.addEventListener("drop",e=>{e.preventDefault();const fromId=draggedId||(e.dataTransfer&&e.dataTransfer.getData("text/plain"));const toId=card.dataset.cardId;if(!fromId||!toId||fromId===toId)return;const from=games.findIndex(g=>g.id===fromId),to=games.findIndex(g=>g.id===toId);if(from<0||to<0)return;const [item]=games.splice(from,1);games.splice(to,0,item);moved=true;localStorage.setItem(storageKey,JSON.stringify(games));render();const movedCard=[...document.querySelectorAll(".card[data-card-id]")].find(c=>c.dataset.cardId===fromId);if(movedCard)movedCard.classList.add("drop-pop");});card.addEventListener("dragend",()=>{window.__gameCardDragging=false;cards.forEach(c=>c.classList.remove("dragging","drag-over"));if(moved){window.__gameCardJustDragged=true;setTimeout(()=>{window.__gameCardJustDragged=false;},180);}draggedId=null;});card.addEventListener("click",e=>{if(window.__gameCardJustDragged){e.preventDefault();e.stopImmediatePropagation();window.__gameCardJustDragged=false;}},true);});}
