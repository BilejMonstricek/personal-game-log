<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Game Log — Danův herní deník</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--panel2:#191f2b;--line:#2a3241;--text:#f3f5fa;--muted:#a0a9ba;--accent:#9b87ff;--good:#65d69a;--bad:#ff7585}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#201b3c 0,transparent 40%),var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--panel2);color:var(--text)}button.primary{background:var(--accent);border-color:transparent;color:#100d1e;font-weight:750}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{padding:24px 16px;border-right:1px solid var(--line);background:#0d1017}.brand{font-size:20px;font-weight:850;letter-spacing:-.5px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.search{width:100%;margin:20px 0 12px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}.game-list{display:grid;gap:8px}.game{display:flex;align-items:center;gap:11px;text-align:left;width:100%;padding:8px;background:transparent;border-color:transparent}.game.active,.game:hover{background:var(--panel2);border-color:var(--line)}.cover{width:52px;height:65px;flex:0 0 52px;border-radius:7px;background:linear-gradient(145deg,#383057,#151a26);display:grid;place-items:center;text-align:center;font-size:10px;font-weight:900;color:#fff;overflow:hidden}.game-name{font-weight:700;font-size:14px}.game-rating{color:var(--accent);font-size:12px}.main{padding:clamp(18px,4vw,48px);max-width:1150px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-size:11px;font-weight:800}.hero{margin:24px 0 26px;min-height:220px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(115deg,rgba(12,13,20,.25),rgba(12,13,20,.95)),radial-gradient(ellipse at 75% 30%,#6a3440,transparent 40%),linear-gradient(135deg,#24283c,#10131d);display:flex;align-items:end;padding:clamp(22px,4vw,42px)}.hero h1{font-size:clamp(34px,6vw,62px);line-height:.98;letter-spacing:-2px;margin:8px 0 14px}.hero p{color:#d0d4df;margin:0;max-width:640px}.meta{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.pill{font-size:12px;color:#d4d8e4;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;border-radius:999px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:24px}.stat,.section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.stat label{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:20px;margin-top:4px}.section{margin:14px 0}.section h2{margin:0 0 13px;font-size:18px}.section p{color:#d7dbe5;white-space:pre-wrap}.points{display:grid;gap:10px}.point{display:flex;gap:10px;align-items:flex-start;color:#dce1ea}.sign{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:900;flex:0 0 24px}.good .sign{background:#153b2b;color:var(--good)}.bad .sign{background:#421d27;color:var(--bad)}.empty{color:var(--muted);padding:20px 0}.editor{display:grid;gap:10px}.editor input,.editor textarea,.editor select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0b0e15;color:var(--text)}.editor textarea{min-height:100px;resize:vertical}.editor label{display:grid;gap:5px;color:var(--muted);font-size:13px}.editor .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.footer{color:var(--muted);font-size:12px;margin-top:26px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:18px}.game-list{display:flex;overflow:auto}.game{min-width:190px}.search{margin:14px 0}.main{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:190px}.editor .two{grid-template-columns:1fr}}
</style>
</head>
<body><div class="layout">
<aside class="sidebar"><div class="brand">🎮 Personal Game Log</div><div class="sub">Danův osobní herní deník</div><input class="search" id="search" placeholder="Hledat hru…" aria-label="Hledat hru"><div class="game-list" id="gameList"></div><div class="actions"><button class="primary" id="addBtn">＋ Přidat hru</button></div><p class="sub">Nové recenze můžeš postupně přidávat do knihovny.</p></aside>
<main class="main"><div class="topline"><div><div class="eyebrow">Osobní herní knihovna</div><div class="sub">Moje hry, dojmy a hodnocení bez spoilerových románů.</div></div><div class="actions" style="margin:0"><button id="editBtn">Upravit recenzi</button></div></div><div id="detail"></div><div class="footer">Personal Game Log · Soukromé názory, vlastní hodnocení.</div></main>
</div>
<script>
const initialGames=[{id:'wolverine',title:'Marvel’s Wolverine',platform:'PlayStation 5',hours:'22 hodin',rating:'7,5 / 10',status:'Dohráno · Platinová trofej',developer:'Insomniac Games',publisher:'Sony Interactive Entertainment',genre:'Akční adventura',release:'',summary:'Příběhová akční hra, která mě bavila hlavně díky Wolverineovi, soubojům a filmovým momentům. Celkově lehce nadprůměrný zážitek, který ale mohl být výrazně lepší.',likes:['Grafika a prostředí Kanady','Wolverine jako hlavní postava','Pohotové a úderné souboje','Zvuky, hudba a český dabing','Filmové cutscény a souboje s bossy','Herecké výkony záporáků'],dislikes:['Souboje se časem opakují','Málo prostoru pro průzkum','Přílišné vodění za ruku a linearita','Občasné bugy','Některé ženské postavy působí zvláštně navržené','Motorkářské mise','QTE bez výraznějších následků','Některé lokace na sebe příliš nenavazují','Předvídatelný příběh']}];
let games=JSON.parse(localStorage.getItem('personal-game-log-games')||'null')||initialGames;let selected=games[0]?.id;let editing=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem('personal-game-log-games',JSON.stringify(games));render()}
function renderList(){const q=$('search').value.toLowerCase();$('gameList').innerHTML=games.filter(g=>g.title.toLowerCase().includes(q)).map(g=>'<button class="game '+(g.id===selected?'active':'')+'" data-id="'+esc(g.id)+'"><span class="cover">'+esc(g.title.replace('Marvel’s ','').replace('Marvel\'s ',''))+'</span><span><span class="game-name">'+esc(g.title)+'</span><br><span class="game-rating">'+esc(g.rating||'Bez hodnocení')+'</span></span></button>').join('')||'<div class="sub">Žádná hra nenalezena.</div>';document.querySelectorAll('.game').forEach(b=>b.onclick=()=>{selected=b.dataset.id;editing=false;render()})}
function render(){renderList();const g=games.find(x=>x.id===selected);if(!g){$('detail').innerHTML='<p class="empty">Vyber hru nebo přidej novou.</p>';return}if(editing){$('detail').innerHTML='<div class="section"><h2>Upravit hru a recenzi</h2><form class="editor" id="form"><label>Název hry<input name="title" required value="'+esc(g.title)+'"></label><div class="two"><label>Platforma<input name="platform" value="'+esc(g.platform)+'"></label><label>Herní doba<input name="hours" value="'+esc(g.hours)+'"></label></div><div class="two"><label>Hodnocení<input name="rating" value="'+esc(g.rating)+'" placeholder="8/10"></label><label>Stav / trofeje<input name="status" value="'+esc(g.status)+'"></label></div><div class="two"><label>Vývojář<input name="developer" value="'+esc(g.developer)+'"></label><label>Vydavatel<input name="publisher" value="'+esc(g.publisher)+'"></label></div><div class="two"><label>Žánr<input name="genre" value="'+esc(g.genre)+'"></label><label>Datum vydání<input name="release" value="'+esc(g.release)+'"></label></div><label>Celkový verdikt<textarea name="summary">'+esc(g.summary)+'</textarea></label><label>Co se mi líbilo (každý bod na nový řádek)<textarea name="likes">'+esc((g.likes||[]).join('\n'))+'</textarea></label><label>Co mi vadilo (každý bod na nový řádek)<textarea name="dislikes">'+esc((g.dislikes||[]).join('\n'))+'</textarea></label><div class="actions"><button class="primary" type="submit">Uložit změny</button><button type="button" id="cancelBtn">Zrušit</button></div></form></div>'; $('form').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);for(const k of ['title','platform','hours','rating','status','developer','publisher','genre','release','summary'])g[k]=d.get(k).trim();g.likes=d.get('likes').split('\n').map(s=>s.trim()).filter(Boolean);g.dislikes=d.get('dislikes').split('\n').map(s=>s.trim()).filter(Boolean);editing=false;save()};$('cancelBtn').onclick=()=>{editing=false;render()};return}
$('editBtn').textContent='Upravit recenzi';$('detail').innerHTML='<section class="hero"><div><div class="eyebrow">'+esc(g.status||'Osobní recenze')+'</div><h1>'+esc(g.title)+'</h1><p>'+esc(g.summary)+'</p><div class="meta">'+[g.platform,g.genre,g.developer].filter(Boolean).map(x=>'<span class="pill">'+esc(x)+'</span>').join('')+'</div></div></section><div class="stats"><div class="stat"><label>Moje hodnocení</label><strong>'+esc(g.rating||'—')+'</strong></div><div class="stat"><label>Odehráno</label><strong>'+esc(g.hours||'—')+'</strong></div><div class="stat"><label>Platforma</label><strong>'+esc(g.platform||'—')+'</strong></div><div class="stat"><label>Vydání</label><strong>'+esc(g.release||'Neuvedeno')+'</strong></div></div><section class="section"><h2>Co se mi líbilo</h2><div class="points">'+(g.likes||[]).map(x=>'<div class="point good"><span class="sign">＋</span><span>'+esc(x)+'</span></div>').join('')+'</div></section><section class="section"><h2>Co mi vadilo</h2><div class="points">'+(g.dislikes||[]).map(x=>'<div class="point bad"><span class="sign">−</span><span>'+esc(x)+'</span></div>').join('')+'</div></section><section class="section"><h2>Informace o hře</h2><p><b>Vývojář:</b> '+esc(g.developer||'Neuvedeno')+'<br><b>Vydavatel:</b> '+esc(g.publisher||'Neuvedeno')+'<br><b>Žánr:</b> '+esc(g.genre||'Neuvedeno')+'<br><b>Datum vydání:</b> '+esc(g.release||'Neuvedeno')+'</p></section>';
$('editBtn').textContent='Upravit recenzi';$('editBtn').onclick=()=>{editing=true;render()}}
$('addBtn').onclick=()=>{const g={id:'game-'+Date.now(),title:'Nová hra',platform:'',hours:'',rating:'',status:'Rozehráno',developer:'',publisher:'',genre:'',release:'',summary:'',likes:[],dislikes:[]};games.unshift(g);selected=g.id;editing=true;render()};$('editBtn').onclick=()=>{editing=true;render()};$('search').oninput=renderList;render();
</script></body></html>
